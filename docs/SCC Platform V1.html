<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCC Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bin Quraya Safety Command Center platform">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed graphite command rail (left) + scrolling workspace; module banners echo the SCC Power BI headers (condensed type, red diagonal stripes). */
:root{
  --bg:#ECE9E5; --surface:#FAF8F5; --surface-2:#F2EFEB; --line:#DCD6CF; --line-2:#E7E2DC;
  --ink:#1D1C1F; --ink-2:#4A474C; --muted:#7C777B; --faint:#A39E9F;
  --red:#C8102E; --red-2:#E1252F; --red-soft:#F7DCDD; --red-ink:#8E0B20;
  --amber:#D98B13; --amber-soft:#F8E8C9; --green:#3F8A57; --green-soft:#DCEEDF;
  --copper:#B4572E; --steel:#8B8A8F; --sand:#CDB48A; --olive:#7C8C47;
  --rail:#17171A; --rail-2:#202024; --rail-line:#2C2C31; --rail-ink:#E8E6E3; --rail-muted:#8F8C90;
  --shadow:0 1px 2px rgba(29,28,31,.06),0 4px 14px rgba(29,28,31,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111113; --surface:#1A1A1D; --surface-2:#222226; --line:#2F2F35; --line-2:#28282D;
  --ink:#EDEBE8; --ink-2:#C9C6C3; --muted:#9A9699; --faint:#6E6A6E;
  --red:#E1323B; --red-2:#F04A50; --red-soft:#3A1619; --red-ink:#FF8D8F;
  --amber:#F0A63A; --amber-soft:#3A2C14; --green:#5DB37A; --green-soft:#16301E;
  --copper:#D9774A; --steel:#9C9BA1; --sand:#CDB48A; --olive:#9CAD62;
  --rail:#0C0C0E; --rail-2:#17171A; --rail-line:#26262B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1A1A1D; --surface-2:#222226; --line:#2F2F35; --line-2:#28282D;
  --ink:#EDEBE8; --ink-2:#C9C6C3; --muted:#9A9699; --faint:#6E6A6E;
  --red:#E1323B; --red-2:#F04A50; --red-soft:#3A1619; --red-ink:#FF8D8F;
  --amber:#F0A63A; --amber-soft:#3A2C14; --green:#5DB37A; --green-soft:#16301E;
  --copper:#D9774A; --steel:#9C9BA1; --sand:#CDB48A; --olive:#9CAD62;
  --rail:#0C0C0E; --rail-2:#17171A; --rail-line:#26262B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--rail-line);z-index:30}
.rail-brand{padding:18px 18px 14px;border-bottom:1px solid var(--rail-line);display:flex;flex-direction:column;gap:10px}
.rail-brand img{width:150px;height:auto;display:block}
.rail-brand .prod{display:flex;align-items:center;gap:8px}
.rail-brand .prod b{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.rail-brand .prod span{font-size:11px;color:var(--rail-muted);letter-spacing:.06em;text-transform:uppercase}
.rail-brand .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--rail-muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#4CC46F;box-shadow:0 0 0 3px rgba(76,196,111,.18);display:inline-block}
.nav{flex:1;overflow-y:auto;padding:8px 10px 16px}
.nav h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.14em;color:var(--rail-muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#CFCCC9;text-decoration:none;font-size:13.5px;font-weight:500;position:relative;border:1px solid transparent}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--rail-2);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(225,37,47,.22),rgba(225,37,47,.04));color:#fff;border-color:rgba(225,37,47,.35)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red-2)}
.nav a .cnt{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--rail-2);border:1px solid var(--rail-line);padding:1px 6px;border-radius:20px;color:#BDB9B6}
.nav a .cnt.hot{background:#5A1418;border-color:#7A1C22;color:#FFC6C8}
.nav a.locked{opacity:.45}
.nav a .lk{margin-left:auto;width:13px;height:13px}
.rail-user{border-top:1px solid var(--rail-line);padding:12px 14px;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#2A2A2F;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;border:1px solid #3A3A40;flex:none}
.rail-user b{display:block;font-size:13px}
.rail-user small{color:var(--rail-muted);font-size:11.5px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.crumb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink)}
.topbar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:260px;max-width:30vw}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:13px}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono);border:2px solid var(--bg)}
.menu-btn{display:none}
.content{padding-block:20px 48px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- banner ---------- */
.banner{position:relative;overflow:hidden;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;gap:18px;min-height:112px}
.banner::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;background:
 repeating-linear-gradient(115deg,transparent 0 34px,color-mix(in srgb,var(--red) 16%,transparent) 34px 62px,transparent 62px 80px,color-mix(in srgb,var(--red) 30%,transparent) 80px 92px);
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);pointer-events:none}
.banner .bicon{width:62px;height:62px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--red) 35%,transparent)}
.banner .bicon svg{width:32px;height:32px}
.banner h1{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.92;font-size:clamp(26px,3.4vw,42px);letter-spacing:.01em;text-wrap:balance}
.banner h1 em{font-style:normal;color:var(--red)}
.banner p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.banner p i{font-style:normal;color:var(--red);padding:0 6px}
.banner .bright{margin-left:auto;position:relative;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.tabs .pill{font-size:11px;font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 7px}

/* ---------- filter bar ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.filters .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters label.k{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--muted);text-transform:uppercase}
.filters .range{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.filters .range b{color:var(--ink);font-size:12.5px}
select.sel,input.inp,textarea.inp{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;min-width:0}
select.sel{padding-right:26px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input[type=date].inp{padding:5px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.8}

/* ---------- grid + cards ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.card h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.card .sub{margin:-6px 0 0;font-size:12px;color:var(--muted)}
.card .hd{display:flex;align-items:flex-start;gap:10px}
.card .hd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.chart{position:relative;width:100%;min-height:0}
.chart canvas{max-width:100%}

/* KPI tiles */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;overflow:hidden}
.kpi .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kpi .t .ic{width:28px;height:28px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--red);flex:none}
.kpi .t .ic svg{width:16px;height:16px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .spark{position:absolute;right:10px;bottom:10px;width:84px;height:30px}
.kpi.sel{outline:2px solid var(--red);outline-offset:-2px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--faint)}
.delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:var(--f-mono);white-space:nowrap}
.delta.up-bad{background:var(--red-soft);color:var(--red-ink)}
.delta.down-good{background:var(--green-soft);color:var(--green)}
.delta.flat{background:var(--surface-2);color:var(--muted)}
.delta.up-good{background:var(--green-soft);color:var(--green)}
.delta.down-bad{background:var(--red-soft);color:var(--red-ink)}

/* image KPI (summary page) */
.ikpi{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:stretch;padding:12px 12px 12px 16px}
.ikpi .art{border-radius:8px;overflow:hidden;background:#1a0c0d;position:relative;min-height:96px}
.ikpi .art svg{width:100%;height:100%;display:block}

/* status, risk pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.open{background:var(--red-soft);color:var(--red-ink)}
.st.up{background:var(--amber-soft);color:var(--amber)}
.st.closed{background:var(--green-soft);color:var(--green)}
.rk{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;border:1px solid transparent}
.rk.High{background:var(--red);color:#fff}
.rk.Medium{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.rk.Low{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.rk.NA{background:transparent;color:var(--muted);border-color:var(--line)}
.tagx{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tagx.red{background:var(--red);color:#fff;border-color:var(--red)}
.tagx.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tagx.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.tagx svg{width:12px;height:12px}

/* bars (list) */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 44px;align-items:center;gap:10px;font-size:12.5px}
.bar .l{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--steel);border-radius:5px}
.bar.tot .tr i{background:var(--ink-2)}
.bar .v{text-align:right;font-family:var(--f-mono);font-size:12px;font-weight:600}
.bar.clk{cursor:pointer}.bar.clk:hover .l{color:var(--red)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.clk{cursor:pointer}
.tbl tbody tr.clk:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl .id{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.tbl .thumb{width:58px;height:38px;border-radius:5px;overflow:hidden;border:1px solid var(--line);display:block;background:#222}
.tbl .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tbl.log{min-width:1120px}
.tbl .nw{white-space:nowrap}
.tbl .clip{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.tbl tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.heat{position:relative}
.heat::before{content:"";position:absolute;inset:3px 4px;border-radius:4px;background:var(--red);opacity:var(--h,0)}
.heat span{position:relative}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12.5px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost-red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--red);font-weight:600;cursor:pointer;padding:0;font-size:12.5px}

/* gauge */
.gauge{position:relative;width:100%;max-width:280px;margin:0 auto}
.gauge .gv{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.gauge .gl{position:absolute;bottom:2px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:60;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(980px,100%);height:100%;background:var(--bg);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px)}to{transform:none}}
.drawer-hd{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.drawer-hd h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.drawer-hd .sub{font-size:12.5px;color:var(--muted)}
.drawer-body{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.dlg{width:min(560px,100%);background:var(--surface);border-radius:12px;border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h3{margin:0;font-family:var(--f-display);font-size:22px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.kv div span{color:var(--muted)}
.kv div b{text-align:right;font-weight:600}
.kv.one{grid-template-columns:1fr}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note.red{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.note.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.note.green{background:var(--green-soft);border-color:transparent;color:var(--green)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.photo{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:zoom-in}
.photo img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#111}
.photo figcaption{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.photo figcaption b{color:var(--ink);font-weight:600}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:min(1200px,100%);max-height:86vh;border-radius:8px}
.lightbox p{color:#ddd;text-align:center;margin:10px 0 0;font-size:13px}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tl .ev{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl .ev::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl .ev:last-child::before{display:none}
.tl .ev i{width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--steel);margin-top:1px}
.tl .ev.red i{border-color:var(--red)}.tl .ev.amber i{border-color:var(--amber)}.tl .ev.green i{border-color:var(--green)}
.tl .ev b{font-size:13px}.tl .ev small{display:block;color:var(--muted);font-size:12px}

/* forms */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 270px;gap:14px;align-items:start}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:700;color:var(--ink-2)}
.fld label .req{color:var(--red)}
.fld .hint{font-size:11.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld input[readonly]{background:var(--surface-2);color:var(--muted)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.fld .locked{opacity:.55;pointer-events:none}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--surface-2);position:relative}
.drop:hover{border-color:var(--red)}
.drop svg{width:20px;height:20px;color:var(--muted);flex:none}
.drop b{font-size:13px;display:block}.drop small{color:var(--muted);font-size:11.5px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .pv{width:92px;height:58px;border-radius:6px;object-fit:cover;margin-left:auto;border:1px solid var(--line)}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;background:var(--surface)}
.radio label:has(input:checked){border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.radio input{accent-color:var(--red)}
.progress{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex:1;min-width:80px}
.progress i{display:block;height:100%;background:var(--red);transition:width .2s}
.formbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:3}
.formbar .msg{font-size:12.5px;font-weight:600;color:var(--red)}
.formbar .msg.ok{color:var(--green)}
.steps{display:flex;flex-direction:column;gap:12px}
.steps div{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:12.5px}
.steps div i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.steps div b{display:block;font-size:13px}
.steps div span{color:var(--muted)}
.choice{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.choice .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.logo-chip{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:13px;padding:1px 7px;border-radius:4px}
.logo-chip.itq{background:#1D1C1F;color:#fff}.logo-chip.itq em{font-style:normal;color:#E1252F}
.logo-chip.sl{background:#0F6B4D;color:#fff}

/* notifications panel */
.npanel{position:fixed;top:58px;right:max(16px,env(safe-area-inset-right,0px));width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 80px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.28);z-index:70}
.npanel .nh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface)}
.npanel .nh b{font-family:var(--f-display);font-size:19px}
.nitem{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:12.5px}
.nitem:hover{background:var(--surface-2)}
.nitem .bar8{width:4px;border-radius:2px;background:var(--steel)}
.nitem.High .bar8{background:var(--red)}.nitem.Medium .bar8{background:var(--amber)}.nitem.Low .bar8{background:var(--sand)}
.nitem b{display:block;font-size:13px}
.nitem small{color:var(--muted)}
.nitem .ov{font-family:var(--f-mono);font-weight:700;color:var(--red);text-align:right;font-size:12px}
.nitem .ov.soon{color:var(--amber)}

.toast svg{width:16px;height:16px;flex:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}

/* weather */
.wx-table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:1100px;width:100%}
.wx-table th{padding:6px 6px;font-size:11px;font-weight:700;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);color:var(--ink-2)}
.wx-table td{padding:4px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center}
.wx-table input{width:100%;min-width:52px;border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-size:12px;background:var(--surface);text-align:center;font-family:var(--f-mono)}
.wx-table input.rm{text-align:left;font-family:var(--f-body);min-width:160px}
.wx-table tr.now td{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.wx-table tr.missed td.t{color:var(--red)}
.wx-table td.t{font-weight:700;white-space:nowrap;text-align:left;padding-left:8px}
.th-wind{background:color-mix(in srgb,#E9C46A 30%,transparent)}
.th-temp{background:color-mix(in srgb,#C9B79C 30%,transparent)}
.th-rh{background:color-mix(in srgb,#9CB380 28%,transparent)}
.th-co2{background:color-mix(in srgb,#E3A27C 30%,transparent)}
.th-pm{background:color-mix(in srgb,#A9A6A3 28%,transparent)}
.th-hi{background:color-mix(in srgb,#B9CF9A 30%,transparent)}
.th-rem{background:color-mix(in srgb,#F0D49B 30%,transparent)}
.hicat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.hicat.c0{background:var(--surface-2);color:var(--muted)}
.hicat.c1{background:#F6E7A6;color:#6B5600}
.hicat.c2{background:#F4BE7E;color:#6B3500}
.hicat.c3{background:#E5604F;color:#fff}
.hicat.c4{background:#8E0B20;color:#fff}
.stn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stn div{background:var(--surface-2);border-radius:7px;padding:7px 9px}
.stn small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stn b{font-family:var(--f-display);font-size:20px}

/* report doc */
.doc{background:#fff;color:#1d1c1f;border-radius:6px;padding:34px 40px;box-shadow:0 2px 20px rgba(0,0,0,.12);font-size:12.5px;max-width:980px;margin:0 auto;width:100%}
.doc h1{font-family:var(--f-display);font-size:26px;margin:0;text-transform:uppercase}
.doc h2{font-family:var(--f-display);font-size:17px;margin:18px 0 8px;text-transform:uppercase;color:#8E0B20;border-bottom:2px solid #C8102E;padding-bottom:3px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px}
.doc th{background:#2a2a2e;color:#fff;padding:5px 6px;text-align:left;font-weight:600}
.doc td{padding:5px 6px;border-bottom:1px solid #e3ded8}
.doc td.n,.doc th.n{text-align:right;font-family:var(--f-mono)}
.doc .dh{display:flex;align-items:center;gap:16px;border-bottom:3px solid #C8102E;padding-bottom:12px}
.doc .dh img{width:140px}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.doc .meta div{background:#f4f1ed;border-radius:5px;padding:6px 8px}
.doc .meta small{display:block;color:#7c777b;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.doc .sig div{border:1px solid #dcd6cf;border-radius:6px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:3px}
.doc .sig .ink{font-family:"Brush Script MT","Segoe Script",cursive;font-size:24px;color:#14306b;min-height:32px}
.doc .kp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.doc .kp div{border:1px solid #e3ded8;border-radius:5px;padding:6px 8px}
.doc .kp b{font-family:var(--f-display);font-size:22px;display:block}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.flow .s{padding:12px 14px;border:1px solid var(--line);background:var(--surface);position:relative;display:flex;flex-direction:column;gap:3px}
.flow .s:first-child{border-radius:10px 0 0 10px}.flow .s:last-child{border-radius:0 10px 10px 0}
.flow .s+.s{border-left:0}
.flow .s b{font-size:13px}.flow .s small{color:var(--muted);font-size:12px}
.flow .s .n{font-family:var(--f-display);font-size:13px;color:var(--red);font-weight:800;letter-spacing:.08em}

/* contacts */
.ct-head{background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border-radius:8px 8px 0 0}
.ct-head.red{background:var(--red);color:#fff}
.ecall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ecall div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.ecall small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ecall b{font-family:var(--f-display);font-size:24px;color:var(--red)}
.copy{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px}
.copy svg{width:13px;height:13px}

.empty{padding:28px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw{display:inline-block;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:16px}
.matrix td{text-align:center}
.lockpage{display:grid;place-items:center;padding:60px 20px;text-align:center;gap:10px}
.lockpage svg{width:42px;height:42px;color:var(--red)}

/* responsive */
@media (max-width:1280px){.g7{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form-grid>.aside{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px}}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3,.span4{grid-column:1/-1}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  .app.navopen .rail{transform:none}
  .menu-btn{display:grid}
  .search{display:none}
  .g2,.g3,.g4,.g5,.g6,.g7,.form-grid,.fgrid,.kv{grid-template-columns:minmax(0,1fr)}
  .span2,.span3,.span4{grid-column:auto}
  .form-grid>.aside{grid-template-columns:1fr}
  .banner::after{width:70%}
  .flow{grid-template-columns:1fr}.flow .s{border-radius:0!important;border-left:1px solid var(--line)!important}
  .ikpi{grid-template-columns:1fr 90px}
  .doc{padding:20px 16px}.doc .meta,.doc .kp,.doc .sig{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.topbar .seg.role{display:none}.banner{flex-wrap:wrap}.banner .bright{margin-left:0;justify-content:flex-start}.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

.note svg,.dlg h3 svg,.choice svg,.copy svg,.linkbtn svg,.chip svg,.card h3 svg,.crumb svg{width:14px;height:14px;vertical-align:-2px;flex:none}
.dlg h3 svg{width:18px;height:18px}
.ecall b{font-size:19px;white-space:nowrap}
.wxgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.npanel .nh svg{width:18px;height:18px;flex:none}
@media (min-width:1281px){.form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 270px}.form-grid>section{grid-column:auto}.form-grid>.aside{grid-column:3;grid-row:1 / span 6;align-self:start;position:sticky;top:70px}}

.bigpv{margin-top:2px}.bigpv img{aspect-ratio:16/10;max-height:280px;object-fit:contain;background:#111}

.matrix svg{width:16px;height:16px}

/* time generator: spread n records over months with weights, up to NOW */
function spread(total,w12){
  const cm=NOW.getMonth();const dim=new Date(YEAR,cm+1,0).getDate();
  const w=w12.map((v,i)=>i<cm?v:i===cm?v*(NOW.getDate()/dim):0);
  const s=w.reduce((a,b)=>a+b,0);const out=[];
  let acc=0;w.forEach((v,i)=>{let n=Math.round(total*v/s);if(i===cm)n=total-acc;acc+=n;
    const last=i===cm?NOW.getDate():new Date(YEAR,i+1,0).getDate();
    for(let k=0;k<n;k++){let day=ri(1,last);let h=ri(6,21);if(i===cm&&day===NOW.getDate()){h=ri(6,Math.max(6,NOW.getHours()-1))}
      const t=new Date(YEAR,i,day,h,ri(0,59));if(t>NOW)t.setTime(NOW.getTime()-ri(10,300)*6e4);out.push(t)}});
  return out.sort((a,b)=>a-b);
}
function statusFor(t,risk,kind){
  const ageH=(NOW-t)/HOUR;
  if(kind==='sos'){return ageH<30&&rnd()<.5?'Open':'Closed'}
  let pOpen,pUP;
  if(ageH>24*30){pOpen=.0012;pUP=.0006}else if(ageH>24*10){pOpen=.05;pUP=.03}else if(ageH>48){pOpen=.3;pUP=.25}else{pOpen=.55;pUP=.25}
  const r=rnd();return r<pOpen?'Open':r<pOpen+pUP?'Under Review':'Closed';
}

function closeTimes(rec){

}

function heatIndex(T,RH){const F=T*9/5+32;let HI=.5*(F+61+(F-68)*1.2+RH*.094);if((HI+F)/2>=80){HI=-42.379+2.04901523*F+10.14333127*RH-.22475541*F*RH-.00683783*F*F-.05481717*RH*RH+.00122874*F*F*RH+.00085282*F*RH*RH-.00000199*F*F*RH*RH;if(RH<13&&F>=80&&F<=112)HI-=((13-RH)/4)*Math.sqrt((17-Math.abs(F-95))/17);else if(RH>85&&F>=80&&F<=87)HI+=((RH-85)/10)*((87-F)/5)}return Math.round(((HI-32)*5/9)*10)/10}

(function genWX(){RNG=mulberry(4242);
  const start=new Date(YEAR,0,1);
  for(let d=new Date(start);d<=NOW;d.setDate(d.getDate()+1)){

      const rows=WX_HOURS.map((h,i)=>{

        if(!today&&rnd()<.01)return null;

        const hi=heatIndex(T,RH);
        return{wind,T,RH,co2:Math.round(560+rnd()*45),pm25,pm10,hi,rem:hiCat(hi).c>=2?'Heat stress controls applied':(wind>8?'Dusty, windy conditions':'Normal weather'),by:pick(['Fajr','Leena','Nawaz','Noot'])}});

function slaState(r){
  if(r.status==='Closed'||r.type==='itqan')return null;

  if(age>h*RULES.escalate)return{k:'esc',label:'Escalated',over:age-h,h};

}

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function range(f=S.f){
  const n=NOW;let a,b=n.getTime(),pa,pb,label,cmp;
  const t0=sod(n);
  switch(f.period){
    case 'today':a=t0.getTime();pa=a-DAY;pb=b-DAY;label='Today, '+fmtD(a);cmp='yesterday';break;
    case 'week':{const w=weekStart(n);a=w.getTime();pa=a-7*DAY;pb=b-7*DAY;label=fmtD(a)+' to '+fmtD(b)+' (Week '+weekNo(n)+')';cmp='last week';break}
    case 'lastweek':{const w=weekStart(n);b=w.getTime()-1;a=w.getTime()-7*DAY;pa=a-7*DAY;pb=a-1;label=fmtD(a)+' to '+fmtD(b)+' (Week '+weekNo(new Date(a))+')';cmp='the week before';break}
    case 'month':{a=new Date(n.getFullYear(),n.getMonth(),1).getTime();const pm=new Date(n.getFullYear(),n.getMonth()-1,1);pa=pm.getTime();pb=pa+(b-a);label=MONTHS[n.getMonth()]+' '+n.getFullYear()+' to date';cmp='same days last month';break}
    case 'lastmonth':{const s=new Date(n.getFullYear(),n.getMonth()-1,1);a=s.getTime();b=new Date(n.getFullYear(),n.getMonth(),1).getTime()-1;const p=new Date(n.getFullYear(),n.getMonth()-2,1);pa=p.getTime();pb=a-1;label=MONTHS[s.getMonth()]+' '+s.getFullYear();cmp=MONTHS[p.getMonth()];break}
    case 'custom':{a=f.from?new Date(f.from+'T00:00').getTime():new Date(YEAR,0,1).getTime();b=f.to?new Date(f.to+'T23:59:59').getTime():n.getTime();const L=b-a;pb=a-1;pa=a-L;label=fmtD(a)+' to '+fmtD(b);cmp='previous '+Math.round(L/DAY)+' days';break}
    default:{a=new Date(YEAR,0,1).getTime();pa=new Date(YEAR-1,0,1).getTime();pb=pa+(b-a);label='1 Jan to '+fmtD(b)+' '+'(Year to date)';cmp=null}
  }
  return{a,b,pa,pb,label,cmp};
}
function inScope(r,f=S.f){
  if(!accessOk(r))return false;
  if(f.view==='project'){if(!r.project)return false;if(f.project!=='All'&&r.project!==f.project)return false}

}

function sortedEntries(m,limit){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);return limit?e.slice(0,limit):e}
function deltaChip(cur,prev,goodWhenDown=true){
  if(prev==null)return '';
  if(!prev&&!cur)return '<span class="delta flat">0%</span>';
  if(!prev)return `<span class="delta ${goodWhenDown?'up-bad':'up-good'}">▲ new</span>`;
  const d=Math.round((cur-prev)/prev*100);
  if(d===0)return '<span class="delta flat">0%</span>';
  const up=d>0;const cls=up?(goodWhenDown?'up-bad':'up-good'):(goodWhenDown?'down-good':'down-bad');
  return `<span class="delta ${cls}">${up?'▲':'▼'} ${Math.abs(d)}%</span>`;
}

/* small sparkline svg */
function spark(vals,color){const w=84,h=30;const mx=Math.max(1,...vals),mn=Math.min(...vals);const sx=w/(vals.length-1||1);
  const pts=vals.map((v,i)=>[i*sx,h-3-((v-mn)/((mx-mn)||1))*(h-8)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.6" fill="${color}"/></svg>`}
function barsHTML(entries,opts={}){const mx=Math.max(1,...entries.map(e=>e[1]));return `<div class="bars">${entries.map(([k,v])=>`<div class="bar ${opts.click?'clk':''} ${k==='Total'?'tot':''}" ${opts.click?`data-bar="${esc(k)}"`:''}><span class="l" title="${esc(k)}">${esc(k)}</span><span class="tr"><i style="width:${(v/mx*100).toFixed(1)}%;${opts.color?'background:'+(typeof opts.color==='function'?opts.color(k):opts.color):''}"></i></span><span class="v">${fmtN(v)}</span></div>`).join('')}</div>`}

/* ---------- KPI tile ---------- */
function kpi({t,ic,v,s,d,sp,spc,cls='',attr=''}){return `<div class="kpi ${cls}" ${attr}><div class="t"><span class="ic">${I(ic)}</span>${t}${d?`<span style="margin-left:auto">${d}</span>`:''}</div><div class="v">${v}</div><div class="s">${s||''}</div>${sp?spark(sp,spc||PAL().red):''}</div>`}

/* ---------- banner ---------- */
function banner(icon,l1,l2,tag,right=''){return `<section class="banner"><div class="bicon">${I(icon)}</div><div><h1>${l1} <em>${l2}</em></h1><p>${tag||'Real-Time Monitoring<i>•</i>Smarter Decisions<i>•</i>Safer Operations'}</p></div><div class="bright">${right}</div></section>`}

const SNAP_CACHE={};
function rngFrom(seed){return mulberry(seed)}

function snap(r,kind){
  const key=r.id+'|'+kind;if(SNAP_CACHE[key])return SNAP_CACHE[key];
  if(r.files&&r.files[kind])return r.files[kind];
  const g=rngFrom((r.seed||7)+kind.length*101);const R=()=>g();const W=640,H=400;

    const sky=morning?['#cfd9df','#f3e6cf']:['#e9d6b8','#f6ecd9'];const ground=['#d7b98f','#c49a6c'];

    objs+=`<rect x="0" y="${hz-6}" width="${W}" height="5" fill="#6d6f73" opacity=".6"/>`;
    for(let i=0;i<6;i++){const x=R()*W;objs+=`<rect x="${x}" y="${hz-52}" width="4" height="52" fill="#5c5f63" opacity=".6"/>`}
    // equipment
    const ex=60+R()*200;objs+=`<g transform="translate(${ex},${hz+50})"><rect x="0" y="40" width="150" height="40" rx="6" fill="#e2a21b"/><rect x="18" y="8" width="60" height="40" rx="4" fill="#d1931a"/><rect x="26" y="14" width="30" height="20" fill="#3a4a55"/><path d="M78 30 L170 -20 L182 -12 L96 42Z" fill="#c98a18"/><path d="M170 -20 L200 30 L184 36 L168 -8Z" fill="#9c6a10"/><rect x="-6" y="78" width="164" height="16" rx="8" fill="#2f2f33"/></g>`;
    // workers
    const n=2+Math.floor(R()*2);const wx=[];for(let i=0;i<n;i++){const x=330+R()*260,y=hz+60+R()*90,sc=.8+R()*.5;wx.push([x,y,sc]);
      const helmetOk=kind==='close'||i>0||r.category!=='Personal Protective Equipment';

    const t=wx[0];const bx=t[0]-26*t[2],by=t[1]-26*t[2],bw=52*t[2],bh=108*t[2];
    const ok=kind==='close';const col=ok?'#2fd16b':'#ff2b2b';
    const lbl=ok?'CORRECTED  ✓':(r.category||'UNSAFE').toUpperCase().slice(0,30)+'  '+(0.82+R()*.16).toFixed(2);
    s=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ground[0]}"/><stop offset="1" stop-color="${ground[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${hz}" fill="url(#sk)"/><rect y="${hz}" width="${W}" height="${H-hz}" fill="url(#gr)"/>${objs}
    ${ok?`<rect x="${bx-6}" y="${by-6}" width="${bw+12}" height="${bh+12}" fill="none" stroke="${col}" stroke-width="3"/>`:`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="none" stroke="${col}" stroke-width="3"/><path d="M${bx-8} ${by-8}h16M${bx-8} ${by-8}v16" stroke="${col}" stroke-width="3"/>`}
    <rect x="${Math.min(bx,W-300)}" y="${by-30}" width="${Math.min(300,lbl.length*9+16)}" height="22" fill="${col}"/><text x="${Math.min(bx,W-300)+8}" y="${by-14}" font-family="monospace" font-size="13" font-weight="700" fill="#fff">${esc(lbl)}</text>
    ${hud((r.camera||'CAM')+'  ·  '+r.project+'  ·  '+(r.location||''),ok?'CLOSE-OUT':'● REC  '+ts,ok?'#2fd16b':null)}
    <rect y="${H-28}" width="${W}" height="28" fill="#000" opacity=".5"/><text x="12" y="${H-10}" font-family="monospace" font-size="12.5" fill="#fff">${ok?esc('HSEO: '+(r.hseo||'')+'  ·  '+ts):esc((r.detection==='Manual'?'MANUAL CAPTURE':'AI DETECTION')+'  ·  '+r.alertType+'  ·  '+r.id)}</text>`;

    <rect x="360" y="90" width="150" height="190" fill="none" stroke="#ff2b2b" stroke-width="3"/><rect x="360" y="64" width="${(r.violation||'').length*9+70}" height="24" fill="#ff2b2b"/><text x="368" y="81" font-family="monospace" font-size="13" font-weight="700" fill="#fff">${esc((r.violation||'').toUpperCase())} ${(0.85+R()*.13).toFixed(2)}</text>
    ${hud('DMS · CABIN · '+(r.asset||''),'● '+ts)}
    <rect y="${H-28}" width="${W}" height="28" fill="#000" opacity=".6"/><text x="12" y="${H-10}" font-family="monospace" font-size="12.5" fill="#fff">${esc((r.model||'')+'  ·  '+ri2(g,30,90)+' km/h  ·  '+(r.coords||''))}</text>`;
  } else if(kind==='fms'){
    let roads='';for(let i=0;i<9;i++){roads+=`<path d="M${R()*W} 0 Q ${R()*W} ${H/2} ${R()*W} ${H}" stroke="#d9d3c7" stroke-width="${2+R()*5}" fill="none"/>`}
    let trail='M40 '+(300-R()*60);const pts=[];for(let i=1;i<=12;i++){const x=40+i*48,y=320-i*18-R()*30;trail+=' L'+x+' '+y;pts.push([x,y])}
    const pk=pts[7];
    s=`<rect width="${W}" height="${H}" fill="#f1ede5"/>${roads}<path d="M0 260 C 200 200, 400 300, 640 150" stroke="#e9c98b" stroke-width="16" fill="none"/>
    ${[...Array(30)].map(()=>`<rect x="${R()*W}" y="${R()*H}" width="${10+R()*30}" height="${8+R()*20}" fill="#e2dcd0"/>`).join('')}
    <path d="${trail}" stroke="#1d1c1f" stroke-width="3" fill="none" stroke-dasharray="6 4"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===7?9:5}" fill="${i>=5&&i<=9?'#c8102e':'#4a474c'}" stroke="#fff" stroke-width="2"/>`).join('')}
    <g transform="translate(${pk[0]+16},${pk[1]-88})"><rect width="210" height="78" rx="8" fill="#1d1c1f"/><text x="12" y="22" font-family="monospace" font-size="12" fill="#bbb">${esc(r.asset||'')}</text><text x="12" y="50" font-family="sans-serif" font-size="26" font-weight="700" fill="#ff4b4b">${r.speed||''} km/h</text><text x="12" y="68" font-family="monospace" font-size="11" fill="#ddd">LIMIT ${r.limit||''} · ${esc(r.kind||'')}</text></g>
    <rect width="${W}" height="30" fill="#1d1c1f"/><text x="12" y="20" font-family="sans-serif" font-weight="700" font-size="14" fill="#fff">FMS · GPS TRACKING</text><text x="${W-12}" y="20" font-family="monospace" font-size="12.5" fill="#fff" text-anchor="end">${esc(ts)}</text>`;
  } else if(kind==='itqan'){
    const ref=(r.itqan&&r.itqan.ref)||r.itqRef||'ITQ-'+ri2(g,100000,199999);
    s=`<rect width="${W}" height="${H}" fill="#f4f4f6"/><rect width="${W}" height="54" fill="#1d1c1f"/><rect x="18" y="14" width="8" height="26" fill="#e1252f"/><rect x="28" y="20" width="8" height="20" fill="#fff"/><text x="46" y="37" font-family="sans-serif" font-weight="800" font-size="24" fill="#fff">ITQ<tspan fill="#e1252f">A</tspan>N</text><text x="${W-16}" y="34" font-family="sans-serif" font-size="13" fill="#bbb" text-anchor="end">Internal Violations · Bin Quraya</text>
    <rect x="24" y="72" width="${W-48}" height="40" rx="6" fill="#dff1e4"/><text x="40" y="97" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f7a46">✓ Violation uploaded successfully · Ref ${esc(ref)}</text>
    ${[['Driver',(r.driver||'')+' / '+(r.badge||'')],['Violation',r.violation||('Speeding '+(r.speed||'')+' km/h')],['Vehicle',(r.vehicleType||'')+' · '+(r.model||'')+' · '+(r.asset||'')],['Assigned to',scopeOf(r)],['Date',fmtDT(r.ts)],['Status','Under Safety']].map((x,i)=>`<text x="40" y="${148+i*36}" font-family="sans-serif" font-size="13" fill="#7c777b">${x[0]}</text><rect x="170" y="${130+i*36}" width="${W-210}" height="26" rx="4" fill="#fff" stroke="#ddd"/><text x="180" y="${148+i*36}" font-family="sans-serif" font-size="13" fill="#1d1c1f">${esc(x[1])}</text>`).join('')}`;

  } else if(kind==='worker'){
    s=`<defs><linearGradient id="wb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcc4"/><stop offset="1" stop-color="#c9ab80"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#wb)"/><rect x="0" y="250" width="${W}" height="150" fill="#bf9c6c"/>
    <g transform="translate(320,210)"><rect x="-90" y="40" width="180" height="200" rx="40" fill="#ee7d12"/><rect x="-90" y="90" width="180" height="16" fill="#d8ff3c"/><circle cx="0" cy="-20" r="62" fill="#a8745a"/><path d="M-70 -30 a70 62 0 0 1 140 0z" fill="#fff"/><rect x="-78" y="-34" width="156" height="12" rx="6" fill="#f2f2f2"/><circle cx="58" cy="-40" r="8" fill="#c8102e"/></g>
    ${hud(r.source+' · '+(r.worker||''),'✓ SAFE  '+fmtDT(r.closedAt||r.ts),'#2fd16b')}`;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
  return SNAP_CACHE[key]=svgURI(svg);
}
function ri2(g,a,b){return a+Math.floor(g()*(b-a+1))}
function photo(src,title,meta){return `<figure class="photo" data-lb="${esc(title)}"><img src="${src}" alt="${esc(title)}" loading="lazy"><figcaption><b>${esc(title)}</b><span>${esc(meta||'')}</span></figcaption></figure>`}
document.addEventListener('click',e=>{const f=e.target.closest('.photo');if(!f)return;const img=$('img',f);const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML=`<div><img src="${img.src}" alt=""><p>${esc(f.dataset.lb)} · click anywhere to close</p></div>`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)});

/* ---------- modals ---------- */
function openDrawer(html,onClose){closeDrawer();const sc=document.createElement('div');sc.className='scrim';sc.id='drawer';sc.innerHTML=`<div class="drawer" role="dialog" aria-modal="true">${html}</div>`;sc.addEventListener('mousedown',e=>{if(e.target===sc)closeDrawer()});document.body.appendChild(sc);S.onDrawerClose=onClose;return $('.drawer',sc)}
function closeDrawer(){const d=$('#drawer');if(d){d.remove();if(S.onDrawerClose){const f=S.onDrawerClose;S.onDrawerClose=null;f()}}}
function openDialog(html){closeDialog();const sc=document.createElement('div');sc.className='scrim center';sc.id='dialog';sc.style.zIndex=80;sc.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;sc.addEventListener('mousedown',e=>{if(e.target===sc)closeDialog()});document.body.appendChild(sc);return $('.dlg',sc)}
function closeDialog(){const d=$('#dialog');if(d)d.remove()}
function confirmBox(title,msg,okLabel,cb,danger){const d=openDialog(`<h3>${esc(title)}</h3><p class="muted" style="margin:0">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cbNo">Cancel</button><button class="btn ${danger?'pri':'dark'}" id="cbYes">${esc(okLabel)}</button></div>`);$('#cbNo',d).onclick=closeDialog;$('#cbYes',d).onclick=()=>{closeDialog();cb()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.lightbox'))$('.lightbox').remove();else if($('#dialog'))closeDialog();else if($('#npanel'))$('#npanel').remove();else closeDrawer()}});

/* ---------- CSV export (works when hosted; artifact viewers may block downloads) ---------- */
function downloadCSV(name,rows){try{const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob(['﻿'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Excel (CSV) export started: '+name)}catch(e){toast('Export is available on the hosted platform')}}
function printDoc(){try{window.print()}catch(e){}toast('PDF export opens the print dialog on the hosted platform')}

function cell(r,k){
  switch(k){
    case 'thumb':{const kind=r.type==='ai'?'obs':r.type==='dashcam'?'dash':r.type==='speed'?'fms':'worker';return `<span class="thumb"><img src="${snap(r,kind)}" alt="" loading="lazy"></span>`}
    case 'id':return `<span class="id">${r.id}</span>`;
    case 'dt':return `<span class="num nw">${fmtD(r.ts)}<br><small class="muted">${r.time} · W${r.week}</small></span>`;
    case 'scope':return r.project?`<span class="nw">${esc(r.project)}</span>`:`<span class="nw"><span class="muted">Dept:</span> ${esc(r.dept)}</span>`;
    case 'risk':return rkChip(r.risk);
    case 'status':return stChip(r.status);
    case 'driverb':return `${esc(r.driver)}<br><small class="muted mono">${esc(r.badge)}</small>`;
    case 'vehicle':return `${esc(r.vehicleType==='Light Vehicle'?'LV':'HV')} · ${esc(r.model)}`;
    case 'kind':return `<span class="tagx ${r.kind==='ROW'?'amber':''}">${r.kind==='ROW'?'ROW':'Public Road'}</span>`;
    case 'speedv':return `<span class="mono"><b>${r.speed}</b> / ${r.limit}</span>`;
    case 'exceed':return `<span class="mono">+${r.exceed}</span>`;
    case 'category':return `<span class="clip" style="max-width:200px;display:block" title="${esc(r.category)}">${esc(r.category)}</span>`;
    case 'safelife':return r.safelife&&r.safelife.update?`<span class="tagx ${r.status==='Open'?'':'green'}">${r.status==='Open'?'Pending':'Updated'}</span>`:'<span class="tagx">Not required</span>';
    case 'itqan':return r.itqan&&r.itqan.upload?`<span class="tagx ${r.status==='Open'?'':'green'}">${r.status==='Open'?'To upload':'Uploaded'}</span>`:'<span class="tagx">Not uploaded</span>';
    case 'seen':return `<span class="mono">${Math.round((r.seenAt-r.ts)/1000)} s</span>`;
    case 'alarm':return r.alarm?`<span class="tagx ${r.alarm==='True Alarm'?'red':''}">${r.alarm}</span>`:'<span class="muted">At close-out</span>';
    case 'itqStatus':return `<span class="tagx ${r.itqStatus==='Closed'?'green':r.itqStatus==='Under Safety'?'red':r.itqStatus==='Under HR Action'?'amber':''}">${esc(r.itqStatus)}</span>`;
    case 'sla':{const s=slaState(r);if(!s)return r.status==='Closed'?'<span class="muted">Met</span>':'';if(s.k==='ok')return `<span class="muted mono">${fmtDur(s.left)} left</span>`;if(s.k==='soon')return `<span class="tagx amber">${fmtDur(s.left)} left</span>`;return `<span class="tagx red">${s.label} ${fmtDur(s.over)}</span>`}
    case 'asset':return `<span class="nw mono" style="font-size:12px">${esc(r.asset)}</span>`;
    default:return esc(r[k]??'');
  }
}
/* log section: status chips + filters + table + pager */
function logSection(type,base,opts={}){
  const id='log-'+type;const st=S.page[id]=S.page[id]||{status:'All',q:'',risk:'All',x:'All',p:0};
  const cnt=countBy(base,r=>r.status);const od=base.filter(r=>{const s=slaState(r);return s&&(s.k==='over'||s.k==='esc')}).length;
  let rows=base.filter(r=>(st.status==='All'||(st.status==='Overdue'?(()=>{const s=slaState(r);return s&&(s.k==='over'||s.k==='esc')})():r.status===st.status))&&(st.risk==='All'||r.risk===st.risk)&&(st.x==='All'||r[opts.xKey]===st.x));
  if(st.q){const q=st.q.toLowerCase();rows=rows.filter(r=>[r.id,r.driver,r.badge,r.asset,r.location,r.summary,r.worker,r.category,r.violation,r.project,r.dept].some(v=>v&&String(v).toLowerCase().includes(q)))}
  const per=12;const pages=Math.max(1,Math.ceil(rows.length/per));if(st.p>=pages)st.p=pages-1;const view=rows.slice(st.p*per,st.p*per+per);
  const cols=LOG_COLS[type];
  const statuses=type==='itqan'?[]:type==='sos'?['All','Open','Closed']:['All','Open','Under Review','Closed'];
  const xopts=opts.xKey?[...new Set(base.map(r=>r[opts.xKey]).filter(Boolean))].sort():[];
  return `<section class="card" id="${id}">
   <div class="hd"><div><h3>${opts.title||'Log'} <small>${fmtN(rows.length)} of ${fmtN(base.length)} in the selected period · click a row to open it</small></h3></div>
   <div class="r">${opts.right||''}</div></div>
   <div class="row" style="justify-content:space-between">
    <div class="chips">${statuses.map(s=>`<button class="chip ${st.status===s?'on':''}" data-st="${s}">${s} <span class="n">${s==='All'?base.length:cnt[s]||0}</span></button>`).join('')}${type!=='itqan'?`<button class="chip ${st.status==='Overdue'?'on':''}" data-st="Overdue" style="${od?'color:var(--red)':''}">${I('alert')} Overdue <span class="n">${od}</span></button>`:''}</div>
    <div class="row">
     ${opts.xKey?`<select class="sel" data-lx aria-label="${esc(opts.xLabel)}"><option value="All">All ${esc(opts.xLabel)}</option>${xopts.map(o=>`<option ${st.x===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}
     ${type!=='sos'&&type!=='itqan'?`<select class="sel" data-lr aria-label="Risk"><option value="All">All risk levels</option>${['High','Medium','Low'].map(o=>`<option ${st.risk===o?'selected':''}>${o}</option>`).join('')}</select>`:''}
     <div class="search" style="width:220px"><span>${I('search')}</span><input data-lq placeholder="Case ID, driver, asset…" value="${esc(st.q)}" aria-label="Search log"></div>
    </div></div>
   <div class="tbl-wrap"><table class="tbl log"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
   ${view.map(r=>{const s=slaState(r);return `<tr class="clk ${s&&(s.k==='over'||s.k==='esc')?'overdue':''}" data-open="${r.id}">${cols.map(c=>`<td>${cell(r,c[1])}</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="${cols.length}" class="empty">No records match these filters.</td></tr>`}
   </tbody></table></div>
   <div class="pager"><span>Page ${st.p+1} of ${pages}</span><button class="btn sm" data-pg="-1" ${st.p===0?'disabled':''}>Previous</button><button class="btn sm" data-pg="1" ${st.p>=pages-1?'disabled':''}>Next</button>
   <button class="btn sm" data-exp>${I('download')} Export Excel</button></div>
  </section>`;
}
function bindLog(type,base){
  const id='log-'+type;const el=$('#'+id);if(!el)return;const st=S.page[id];
  const re=()=>{const n=document.createElement('div');n.innerHTML=logSection(type,base,el._opts);el.replaceWith(n.firstElementChild);const ne=$('#'+id);ne._opts=el._opts;bindLog(type,base);if(st._focus){const q=$('[data-lq]',ne);q.focus();q.setSelectionRange(q.value.length,q.value.length);st._focus=false}};
  $$('[data-st]',el).forEach(b=>b.onclick=()=>{st.status=b.dataset.st;st.p=0;re()});
  const lr=$('[data-lr]',el);if(lr)lr.onchange=()=>{st.risk=lr.value;st.p=0;re()};
  const lx=$('[data-lx]',el);if(lx)lx.onchange=()=>{st.x=lx.value;st.p=0;re()};
  const q=$('[data-lq]',el);let tmo;q.oninput=()=>{clearTimeout(tmo);tmo=setTimeout(()=>{st.q=q.value;st.p=0;st._focus=true;re()},250)};
  $$('[data-pg]',el).forEach(b=>b.onclick=()=>{st.p+=+b.dataset.pg;re()});
  $$('[data-open]',el).forEach(tr=>tr.onclick=()=>openRecord(tr.dataset.open));
  $('[data-exp]',el).onclick=()=>{const cols=LOG_COLS[type].filter(c=>c[1]!=='thumb');downloadCSV(type+'-log.csv',[cols.map(c=>c[0]),...base.map(r=>cols.map(c=>{const k=c[1];return k==='dt'?r.date+' '+r.time:k==='scope'?scopeOf(r):k==='driverb'?r.driver+' / '+r.badge:k==='speedv'?r.speed+'/'+r.limit:r[k]??''}))])};
}
function mountLog(type,base,opts){const el=$('#log-'+type);if(el){el._opts=opts;bindLog(type,base)}}

/* ---------- record detail drawer ---------- */
const findRec=id=>RECORDS.find(r=>r.id===id);

  const d=openDrawer(`<div class="drawer-hd"><div><div class="sub">${TYPE_LABEL[r.type]} · ${scopeOf(r)}</div><h2 class="mono" style="font-family:var(--f-display)">${r.id}</h2></div><div class="row" style="margin-left:auto">${tag}${r.type!=='itqan'?rkChip(r.risk):''}${stChip(r.status)}<button class="iconbtn" id="dClose" aria-label="Close">${I('x')}</button></div></div><div class="drawer-body" id="dBody"></div>`,()=>render());
  $('#dClose',d).onclick=closeDrawer;

}
function kvList(pairs){return `<div class="kv">${pairs.filter(p=>p&&p[1]!==undefined&&p[1]!==null&&p[1]!=='').map(([k,v])=>`<div><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`}
function drawDetail(r){
  const b=$('#dBody');if(!b)return;
  let pairs=[],photos=[];

    photos.push(photo(snap(r,'obs'),'Observation picture',r.camera+' · '+fmtDT(r.ts)));
    if(r.status!=='Open'||r.returned)photos.push(photo(snap(r,'close'),'Close-out picture',(r.hseo||'').split(' / ')[0]));
    if(r.safelife&&r.safelife.update&&r.status!=='Open')photos.push(photo(snap(r,'safelife'),'SafeLife entry',r.safelife.ref||''));}
  if(r.type==='dashcam'){pairs=[['Assigned to',r.project?'Project: '+esc(r.project):'Department: '+esc(r.dept)],['Vehicle type',r.vehicleType],['Model',esc(r.model)],['Asset number',esc(r.asset)],['Driver',esc(r.driver)+' / '+esc(r.badge)],['Rental driver',r.rental?'Yes · Iqama '+esc(r.iqama):'No'],['Date',fmtD(r.ts)+' (Week '+r.week+')'],['Time',r.time],['Violation type',esc(r.violation)],['Risk level',r.risk+' Risk'],['Location',`<span class="mono">${esc(r.coords)}</span>`],['Reported by',esc(r.operator)]];
    photos.push(photo(snap(r,'dash'),'Violation picture',r.asset));
    if(r.status!=='Open'&&r.itqan.upload)photos.push(photo(snap(r,'itqan'),'ITQAN upload proof',r.itqan.ref||''));}
  if(r.type==='speed'){pairs=[['Assigned to',r.project?'Project: '+esc(r.project):'Department: '+esc(r.dept)],['Speed violation type',r.kind+(r.rowName?' · '+esc(r.rowName):'')],['Vehicle type',r.vehicleType],['Model',esc(r.model)],['Asset number',esc(r.asset)],['Driver',esc(r.driver)+' / '+esc(r.badge)],['Position',esc(r.position)],['Rental driver',r.rental?'Yes · Iqama '+esc(r.iqama):'No'],['Date',fmtD(r.ts)+' (Week '+r.week+')'],['Time',r.time],['Permitted speed',r.limit+' km/h'],['Vehicle speed',`<span style="color:var(--red)">${r.speed} km/h</span>`],['Exceedance','+'+r.exceed+' km/h'],['Risk level',r.risk+' Risk (by exceedance)'],['Location',`<span class="mono">${esc(r.coords)}</span>`],['Reported by',esc(r.operator)]];
    photos.push(photo(snap(r,'fms'),'FMS evidence',r.asset));
    if(r.status!=='Open'&&r.itqan.upload)photos.push(photo(snap(r,'itqan'),'ITQAN upload proof',r.itqan.ref||''));}
  if(r.type==='sos'){pairs=[['Project',esc(r.project)],['Location',esc(r.location)],['Source',r.source],['Worker name & badge',esc(r.worker)],['SOS created at',fmtDT(r.ts)],['Seen at',fmtDT(r.seenAt)+` <span class="muted">(+${Math.round((r.seenAt-r.ts)/1000)} s)</span>`],r.alarm?['Alarm',r.alarm]:null,['Week',r.week],['Registered by',esc(r.operator)],r.status==='Closed'?['Closed at',fmtDT(r.closedAt)]:null,r.status==='Closed'?['Picture shared by',esc(r.sharedBy)]:null];
    if(r.status==='Closed')photos.push(photo(snap(r,'worker'),'Worker picture',r.worker));}
  if(r.type==='itqan'){pairs=[['ITQAN reference',r.itqRef],['Driver',esc(r.driver)+' / '+esc(r.badge)],['Violation',esc(r.violation)],['Vehicle type',r.vehicleType],['Assigned to',scopeOf(r)],['Date',fmtDT(r.ts)],['Source',esc(r.source)+(r.linked?` · <button class="linkbtn" data-goto="${r.linked}">${r.linked}</button>`:'')],['ITQAN status',esc(r.itqStatus)]];photos.push(photo(snap(r,'itqan'),'ITQAN record',r.itqRef))}
  const integ=r.type==='ai'?integAI(r):(r.type==='dashcam'||r.type==='speed')?integITQ(r):'';
  b.innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">
   <div class="grid">
    <section class="card"><h3>Details</h3>${kvList(pairs)}
     ${r.summary?`<div><div class="muted" style="font-size:12px;font-weight:700;margin-bottom:4px">Alert summary</div><div class="note">${esc(r.summary)}</div></div>`:''}
     ${r.closeoutAction?`<div><div class="muted" style="font-size:12px;font-weight:700;margin-bottom:4px">Close-out action · HSEO ${esc(r.hseo||'')}</div><div class="note green">${esc(r.closeoutAction)}</div></div>`:''}
     ${r.type==='sos'&&r.report?`<div><div class="muted" style="font-size:12px;font-weight:700;margin-bottom:4px">Close-out report</div><div class="note green">${esc(r.report)}</div></div>`:''}
     ${r.returned&&r.status==='Open'?`<div class="note red"><b>Returned by ${esc(r.returned.by)}:</b> ${esc(r.returned.reason)}</div>`:''}
    </section>
    <section class="card"><h3>Pictures <small>click to enlarge</small></h3><div class="photos">${photos.join('')}</div></section>
   </div>
   <div class="grid">
    <section class="card" id="actBox"></section>
    ${integ}
    <section class="card"><h3>Activity</h3><div class="tl">${(r.history||[]).slice().sort((a,b)=>a.at-b.at).map(h=>`<div class="ev ${/Approved|Closed/.test(h.act)?'green':/Returned/.test(h.act)?'red':/submitted|confirmed/i.test(h.act)?'amber':''}"><i></i><div><b>${esc(h.act)}</b><small>${esc(h.by)} · ${fmtDT(h.at)}</small></div></div>`).join('')}</div></section>
   </div></div>`;
  $$('[data-goto]',b).forEach(x=>x.onclick=()=>openRecord(x.dataset.goto));
  drawActions(r);if(r.type==='ai')bindIntegAI(r);
}
function integAI(r){const sl=r.safelife||{};return `<section class="card" id="slBox"><h3><span class="logo-chip sl">SafeLife</span> Update</h3>${sl.update?`<div class="note green">Updated in SafeLife · reference <b class="mono">${esc(sl.ref||'to be added at close-out')}</b></div>`:`<div class="note">${esc(SAFELIFE_NO)}</div><div class="row" style="flex-wrap:nowrap"><input class="inp" id="slNew" placeholder="SafeLife reference, e.g. SL-245001" style="flex:1"><button class="btn sm dark" id="slYes">Change to Yes</button></div>`}</section>`}
function bindIntegAI(r){const b=$('#slYes');if(!b)return;b.onclick=()=>{const ref=$('#slNew').value.trim();if(!ref){toast('Enter the SafeLife reference number');$('#slNew').focus();return}r.safelife={update:true,ref};r.history.push({at:Date.now(),by:S.user,act:'Updated in SafeLife ('+ref+')'});audit('SafeLife changed to Yes',r.id,ref);toast('SafeLife updated: '+ref);drawDetail(r)}}
function integITQ(r){const it=r.itqan||{};return `<section class="card"><h3><span class="logo-chip itq">ITQ<em>A</em>N</span> Upload</h3>${it.upload?`<div class="note ${r.status==='Open'?'amber':'green'}">${r.status==='Open'?'Upload to ITQAN at Confirm Driver & Submit.':'Uploaded to ITQAN · '+esc(it.ref||'')+(r.confirmedBy?' · by '+esc(r.confirmedBy):'')}</div>`:`<div class="note">Not uploaded to ITQAN. Reason: ${esc(it.reason||'—')}</div>`}</section>`}

/* actions per state & role */
function drawActions(r){
  const box=$('#actBox');if(!box)return;const admin=S.role==='Admin';
  const del=admin?`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line-2);padding-top:10px"><small class="muted">Deleting is logged with your name.</small><button class="btn sm ghost-red" id="aDel">Delete record</button></div>`:'';
  if(r.type==='itqan'){
    box.innerHTML=`<h3>ITQAN status</h3>${admin?`<div class="fld"><label for="itqS">Update status</label><select id="itqS">${[...Object.keys(ITQ_STATUS),'Closed'].map(s=>`<option ${r.itqStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn dark" id="itqSave">${I('check')} Save status</button>`:`<div class="note">Current status: <b>${esc(r.itqStatus)}</b>. Admin updates the ITQAN status.</div>`}${del}`;
    if(admin)$('#itqSave').onclick=()=>{r.itqStatus=$('#itqS').value;r.status=r.itqStatus==='Closed'?'Closed':'Under Review';audit('ITQAN status changed',r.id,r.itqStatus);r.history.push({at:Date.now(),by:S.user,act:'ITQAN status set to '+r.itqStatus});toast('ITQAN status saved');drawDetail(r)};
  } else if(r.status==='Closed'){
    box.innerHTML=`<h3>Record closed</h3><div class="note green">${r.type==='sos'?'Closed by '+esc(r.closedBy)+' after the four closure fields were completed.':'Approved and closed by '+esc(r.closedBy||'Admin')+' on '+fmtDT(r.closedAt)+'.'}</div>${del}`;
  } else if(r.status==='Under Review'){
    if(admin){box.innerHTML=`<h3>Admin decision</h3><div class="muted" style="font-size:12.5px">${r.type==='ai'?'Review the close-out picture and action.':'Check who confirmed the driver'+(r.itqan&&r.itqan.upload?' and the ITQAN proof':'')+'.'}</div>
      <div class="fld"><label for="rjR">Rejection reason <span class="muted">(required to return)</span></label><textarea id="rjR" placeholder="Explain what the Operator needs to fix"></textarea></div>
      <div class="row"><button class="btn ghost-red" id="aRet" disabled>${I('x')} Return with reason</button><button class="btn ok" id="aApp">${I('check')} Approve and close</button></div>${del}`;
      $('#rjR').oninput=e=>$('#aRet').disabled=!e.target.value.trim();
      $('#aApp').onclick=()=>{r.status='Closed';r.closedAt=Date.now();r.closedBy=S.user;r.history.push({at:Date.now(),by:S.user,act:'Approved and closed'});audit('Approved and closed',r.id,TYPE_LABEL[r.type]);toast(r.id+' approved and closed');refreshDrawerHead(r);drawDetail(r)};
      $('#aRet').onclick=()=>{const why=$('#rjR').value.trim();r.status='Open';r.returned={by:S.user,reason:why,at:Date.now()};r.history.push({at:Date.now(),by:S.user,act:'Returned: '+why});audit('Returned to Operator',r.id,why);toast(r.id+' returned to the Operator');refreshDrawerHead(r);drawDetail(r)};
    } else box.innerHTML=`<h3>Waiting for Admin review</h3><div class="note amber">The ${r.type==='ai'?'close-out':'driver confirmation'} was submitted. Admin approves it (Closed) or returns it with a reason (Open).</div>`;
  } else { // Open
    if(r.type==='ai')closeoutForm(r,box);
    else if(r.type==='dashcam'||r.type==='speed')confirmForm(r,box);

}
function refreshDrawerHead(r){const h=$('.drawer-hd .row');if(!h)return;const s=slaState(r);h.innerHTML=`${s&&s.k!=='ok'?`<span class="tagx ${s.k==='soon'?'amber':'red'}">${I('clock')} ${s.k==='soon'?'Due in '+fmtDur(s.left):s.label}</span>`:''}${r.type!=='itqan'?rkChip(r.risk):''}${stChip(r.status)}<button class="iconbtn" id="dClose" aria-label="Close">${I('x')}</button>`;$('#dClose').onclick=closeDrawer}

/* file field helper: the picture shows in full as soon as it is chosen */
function fileField(id,label,req,hint){return `<div class="fld" data-ff="${id}"><label>${label} ${req?'<span class="req">*</span>':''}</label><label class="drop">${I('upload')}<span><b>Drop a picture here or browse</b><small>${hint||'JPG or PNG'}</small></span><input type="file" accept="image/*" id="${id}"></label><figure class="photo bigpv" hidden data-lb="${esc(label)}" style="margin:0"><img alt="${esc(label)} preview"><figcaption><b>${esc(label)}</b><span>uploaded · click to enlarge</span></figcaption></figure><button type="button" class="linkbtn" data-sample="${id}" style="align-self:flex-start;font-size:12px">Use sample picture</button></div>`}
function bindFile(id,cb,sampleSrc){const inp=$('#'+id);if(!inp)return;const wrap=inp.closest('.fld');const pv=$('.bigpv',wrap);
  const set=src=>{$('img',pv).src=src;pv.hidden=false;cb(src)};
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>set(fr.result);fr.readAsDataURL(f)};
  const smp=$(`[data-sample="${id}"]`,wrap);if(smp)smp.onclick=()=>set(sampleSrc())}
const autoBy=(lbl='Reported by')=>`<div class="fld"><label>${lbl}</label><input readonly value="${esc(S.user)}"><span class="hint">Filled in by the system from the logged-in user</span></div>`;

/* AI close-out (page 19): HSEO typed in manually */
function closeoutForm(r,box){
  const needSL=r.safelife&&r.safelife.update&&!r.safelife.ref;const v={hseo:'',action:'',pic:'',slref:''};
  box.innerHTML=`<h3>Submit close-out</h3><div class="muted" style="font-size:12.5px">The close-out action, picture and Safety Officer move the record to Under Review.</div>
   <div class="fld"><label for="coH">Safety Officer (HSEO) in the area: Name & Badge Number <span class="req">*</span></label><input id="coH" placeholder="Type the name / badge number" autocomplete="off"></div>
   <div class="fld"><label for="coA">Close-out action <span class="req">*</span></label><textarea id="coA" placeholder="Action taken on site"></textarea></div>
   ${fileField('coP','Close-out picture',true,'Image of the corrective action')}
   ${needSL?`<div class="fld"><label for="slR">SafeLife reference number <span class="req">*</span></label><input id="slR" placeholder="SL-000000"></div>`:''}
   ${autoBy('Submitted by')}
   <div class="row"><span class="muted" id="coMsg" style="font-size:12px"></span><button class="btn pri" id="coGo" style="margin-left:auto" disabled>${I('send')} Submit close-out</button></div>`;
  const chk=()=>{const miss=[!v.hseo.trim(),!v.action.trim(),!v.pic,needSL&&!v.slref.trim()].filter(Boolean).length;$('#coGo').disabled=!!miss;$('#coMsg').textContent=miss?miss+' required field'+(miss>1?'s are':' is')+' still empty':'Ready to submit'};
  $('#coH').oninput=e=>{v.hseo=e.target.value;chk()};$('#coA').oninput=e=>{v.action=e.target.value;chk()};if(needSL)$('#slR').oninput=e=>{v.slref=e.target.value;chk()};
  bindFile('coP',s=>{v.pic=s;chk()},()=>snap(Object.assign({},r,{id:r.id+'x',closeoutAt:Date.now(),hseo:v.hseo||'HSEO'}),'close'));chk();
  $('#coGo').onclick=()=>{r.hseo=v.hseo;r.closeoutAction=v.action;r.files=r.files||{};r.files.close=v.pic;if(needSL)r.safelife.ref=v.slref;r.status='Under Review';r.closeoutAt=Date.now();delete r.returned;
    r.history.push({at:Date.now(),by:S.user,act:'Close-out submitted'});audit('Close-out submitted',r.id,'HSEO '+v.hseo);toast('Close-out submitted. Status: Under Review');refreshDrawerHead(r);drawDetail(r)};
}
/* Confirm driver & submit ITQAN proof (page 24): uploaded by = logged-in user */
function confirmForm(r,box){
  const v={driver:r.driver,badge:r.badge,proof:'',ref:'',upload:r.itqan?r.itqan.upload:true,reason:r.itqan&&r.itqan.reason||''};
  box.innerHTML=`<h3>Confirm Driver & Submit</h3><div class="muted" style="font-size:12.5px">One action by one Operator: confirm the driver, choose whether it goes to ITQAN and attach the proof.</div>
   <div class="fgrid"><div class="fld"><label for="cfD">Driver name <span class="req">*</span></label><input id="cfD" value="${esc(v.driver)}"></div><div class="fld"><label for="cfB">Driver badge number <span class="req">*</span></label><input id="cfB" value="${esc(v.badge)}"></div></div>
   <div class="choice"><div class="hd"><span class="logo-chip itq">ITQ<em>A</em>N</span> Upload this violation to ITQAN?</div><div class="radio"><label><input type="radio" name="cfU" value="1" ${v.upload?'checked':''}> Yes, upload</label><label><input type="radio" name="cfU" value="0" ${!v.upload?'checked':''}> No</label></div>
    <div id="cfYes" ${v.upload?'':'hidden'}>${fileField('cfP','ITQAN upload proof (image)',true,'Screenshot that shows the violation uploaded to ITQAN')}<div class="fld" style="margin-top:8px"><label for="cfR">ITQAN reference</label><input id="cfR" placeholder="ITQ-000000"></div></div>
    <div id="cfNo" class="fld" ${v.upload?'hidden':''}><label for="cfN">Reason for not uploading <span class="req">*</span></label><select id="cfN"><option value="">Select a reason</option>${NO_ITQAN_REASONS.map(x=>`<option ${v.reason===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
   <div class="fld"><label>Close-out action</label><input readonly id="cfAct" value="The Violation has been uploaded in ITQAN"></div>
   ${autoBy('Uploaded / confirmed by')}
   <div class="row"><span class="muted" id="cfMsg" style="font-size:12px"></span><button class="btn pri" id="cfGo" style="margin-left:auto" disabled>${I('check')} Confirm Driver & Submit</button></div>`;
  const chk=()=>{const miss=[!v.driver.trim(),!v.badge.trim(),v.upload?!v.proof:!v.reason].filter(Boolean).length;$('#cfGo').disabled=!!miss;$('#cfMsg').textContent=miss?miss+' required field'+(miss>1?'s are':' is')+' still empty':'Ready to submit';$('#cfAct').value=v.upload?'The Violation has been uploaded in ITQAN':'Driver confirmed. Not uploaded to ITQAN ('+(v.reason||'reason required')+')'};
  $('#cfD').oninput=e=>{v.driver=e.target.value;chk()};$('#cfB').oninput=e=>{v.badge=e.target.value;chk()};$('#cfR').oninput=e=>v.ref=e.target.value;$('#cfN').onchange=e=>{v.reason=e.target.value;chk()};
  $$('[name=cfU]').forEach(x=>x.onchange=()=>{v.upload=x.value==='1';$('#cfYes').hidden=!v.upload;$('#cfNo').hidden=v.upload;chk()});
  bindFile('cfP',s=>{v.proof=s;chk()},()=>snap(r,'itqan'));chk();
  $('#cfGo').onclick=()=>{const by=S.user;r.driver=v.driver;r.badge=v.badge;r.confirmedBy=by;r.itqan={upload:v.upload,reason:v.upload?'':v.reason,ref:v.upload?(v.ref||'ITQ-'+(100000+Math.floor(Math.random()*99999))):''};r.files=r.files||{};if(v.proof)r.files.itqan=v.proof;
    r.status='Under Review';r.closeoutAt=Date.now();delete r.returned;r.history.push({at:Date.now(),by,act:v.upload?'Driver confirmed & ITQAN proof submitted ('+r.itqan.ref+')':'Driver confirmed (not uploaded to ITQAN)'});audit('Confirm Driver & Submit',r.id,v.upload?'ITQAN '+r.itqan.ref:'Not uploaded: '+v.reason);
    if(v.upload){const it={type:'itqan',id:mkId('itq'),ts:Date.now(),date:dkey(NOW),time:fmtT(new Date()),week:weekNo(NOW),project:r.project,dept:r.dept,violation:r.type==='speed'?'Speeding':({'Using Phone':'Using Mobile Phone','Seat Belt':'Not Using Seat Belt','Tampering':'Tampering with Device','Camera Covered':'Tampering with Device','Smoking':'Negligence / Reckless Driving'}[r.violation]||'Distracted Driving'),vehicleType:r.vehicleType,driver:r.driver,badge:r.badge,itqStatus:'Under Safety',status:'Under Review',source:TYPE_LABEL[r.type],itqRef:r.itqan.ref,linked:r.id,risk:r.risk,seed:r.seed,history:[{at:Date.now(),by,act:'Created from '+r.id}]};RECORDS.unshift(it)}
    toast('Driver confirmed. Status: Under Review');refreshDrawerHead(r);drawDetail(r)};
}
