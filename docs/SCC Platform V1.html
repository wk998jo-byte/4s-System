/* ---------- generic new-record form (pages 18, 22, 23, 26) ---------- */
function formDrawer(cfg){
  const v=Object.assign({},cfg.defaults||{});
  const d=openDrawer(`<div class="drawer-hd"><div><div class="sub">SCC Platform / ${esc(cfg.title)}</div><h2>${esc(cfg.title)}</h2></div><button class="iconbtn" id="fClose" style="margin-left:auto" aria-label="Close">${I('x')}</button></div>
   <div class="drawer-body"><div class="filters" style="justify-content:space-between"><span><b style="color:var(--red)">*</b> Required fields. Register stays disabled until every required field is completed.</span><span class="row" style="min-width:220px"><span class="progress"><i id="fProg"></i></span><b id="fCount" class="mono" style="font-size:12px"></b></span></div>
   <div class="form-grid" id="fGrid"></div>
   <div class="formbar"><span class="msg" id="fMsg"></span><span style="flex:1"></span><button class="btn" id="fCancel">Cancel</button><button class="btn pri" id="fGo" disabled>${I('check')} ${esc(cfg.submit)}</button></div></div>`);
  $('#fClose',d).onclick=$('#fCancel',d).onclick=closeDrawer;
  const grid=$('#fGrid',d);let refocus=null;
  const fieldHTML=f=>{const id='ff_'+f.k;const lab=`<label for="${id}">${f.label} ${f.req?'<span class="req">*</span>':''}</label>`;let ctl='';
    if(f.type==='select'){const o=typeof f.opts==='function'?f.opts(v):f.opts;ctl=`<select id="${id}"><option value="">${f.ph||'Select'}</option>${o.map(x=>`<option ${v[f.k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
    else if(f.type==='textarea')ctl=`<textarea id="${id}" placeholder="${esc(f.ph||'')}" ${f.ro?'readonly':''}>${esc(v[f.k]||'')}</textarea>`;
    else if(f.type==='radio'){ctl=`<div class="radio">${f.opts.map(x=>`<label><input type="radio" name="${id}" value="${esc(x)}" ${v[f.k]===x?'checked':''}> ${esc(x)}</label>`).join('')}</div>`}
    else if(f.type==='file')return `<div class="fld ${f.full?'full':''}" data-k="${f.k}">${fileField(id,f.label,f.req,f.hint).replace(/^<div class="fld" data-ff="[^"]+">/,'').replace(/<\/div>$/,'')}</div>`;
    else if(f.type==='auto'){v[f.k]=S.user;ctl=`<input id="${id}" value="${esc(S.user)}" readonly>`}
    else if(f.type==='note')return `<div class="fld full"><div class="note">${f.text}</div></div>`;
    else ctl=`<input id="${id}" type="${f.type||'text'}" value="${esc(v[f.k]||'')}" placeholder="${esc(f.ph||'')}" ${f.ro?'readonly':''} ${f.list?`list="${f.list}"`:''} autocomplete="off">`;
    return `<div class="fld ${f.full?'full':''}" data-k="${f.k}">${lab}${ctl}${f.hint&&f.type!=='file'?`<span class="hint" id="h_${f.k}">${typeof f.hint==='function'?f.hint(v):f.hint}</span>`:''}</div>`};
  const draw=()=>{
    grid.innerHTML=cfg.sections.map(sec=>`<section class="card ${sec.span?'span2':''}"><h3>${sec.title}</h3>${sec.sub?`<p class="sub">${sec.sub}</p>`:''}<div class="fgrid">${sec.fields.filter(f=>!f.show||f.show(v)).map(fieldHTML).join('')}</div>${sec.after?sec.after(v):''}</section>`).join('')+
    `<aside class="aside grid"><section class="card"><h3>Record status</h3><div class="kv one"><div><span>Status</span><b>${stChip('Open')}</b></div><div><span>Case ID</span><b class="mono">Generated on save</b></div></div><small class="muted">Set by the system. New records start as Open.</small></section>${cfg.aside||''}</aside>`+(cfg.datalists||'');
    for(const sec of cfg.sections)for(const f of sec.fields){if(f.show&&!f.show(v))continue;const id='ff_'+f.k;
      if(f.type==='file'){bindFile(id,s=>{v[f.k]=s;upd()},()=>f.sample(v));if(v[f.k]){const w=$('#'+id).closest('.fld');const pv=$('.bigpv',w);$('img',pv).src=v[f.k];pv.hidden=false}continue}
      if(f.type==='radio'){$$(`[name=${id}]`).forEach(x=>x.onchange=()=>{v[f.k]=x.value;if(f.onchange)f.onchange(v);draw()});continue}
      const el=$('#'+id);if(!el||el.readOnly)continue;el.addEventListener(f.type==='select'?'change':'input',()=>{v[f.k]=el.value;const res=f.onchange?f.onchange(v):null;if(f.redraw||res==='redraw'){refocus=f.type==='select'?null:id;draw()}else upd()})}
    if(refocus){const e=$('#'+refocus);if(e){e.focus();const n=e.value.length;try{e.setSelectionRange(n,n)}catch(x){}}refocus=null}
    upd()};
  const upd=()=>{if(cfg.derive)cfg.derive(v);for(const sec of cfg.sections)for(const f of sec.fields){if(f.ro){const el=$('#ff_'+f.k);if(el)el.value=v[f.k]||''}}
    const req=cfg.sections.flatMap(s=>s.fields).filter(f=>f.req&&(!f.show||f.show(v)));const done=req.filter(f=>v[f.k]&&String(v[f.k]).trim()).length;
    $('#fProg').style.width=pct(done,req.length)+'%';$('#fCount').textContent=done+' of '+req.length+' completed';const miss=req.length-done;
    $('#fMsg').textContent=miss?miss+' required field'+(miss>1?'s are':' is')+' still empty':'All required fields completed';$('#fMsg').className='msg'+(miss?'':' ok');$('#fGo').disabled=!!miss;
    if(cfg.preview)cfg.preview(v)};
  $('#fGo',d).onclick=()=>{const r=cfg.build(v);r.operator=S.user;r.history=[{at:Date.now(),by:S.user,act:'Registered'}];RECORDS.unshift(r);audit('Registered',r.id,TYPE_LABEL[r.type]+', '+scopeOf(r));toast(r.id+' registered. Status: '+r.status);closeDrawer();setTimeout(()=>openRecord(r.id),50)};
  draw();
}
const nowLocal=()=>{const n=new Date();return{date:dkey(n),time:fmtT(n),dt:dkey(n)+'T'+fmtT(n)}};
function baseRec(type,v,k){const t=new Date(v.date+'T'+(v.time||'00:00'));return{type,id:mkId(k),ts:t.getTime(),date:v.date,time:v.time,week:weekNo(t),seed:Math.floor(Math.random()*99999),files:{}}}
const STEPS=(a)=>`<section class="card"><h3>What happens next</h3><div class="steps">${a.map((x,i)=>`<div><i>${i+1}</i><span><b>${x[0]}</b><span>${x[1]}</span></span></div>`).join('')}</div></section>`;
const REPORTED_BY={title:'Reported by',fields:[{k:'operator',label:'Reported by',type:'auto',full:1,hint:'Filled in by the system from the logged-in user'}]};

/* asset register built from the fleet records: typing an asset fills vehicle type and model */
let ASSETS=null;
function assetIndex(){if(ASSETS)return ASSETS;ASSETS={};for(const r of RECORDS)if((r.type==='dashcam'||r.type==='speed')&&r.asset&&!ASSETS[r.asset])ASSETS[r.asset]={vehicleType:r.vehicleType,model:r.model};return ASSETS}
const ASSET_LIST=()=>`<datalist id="assetList">${Object.keys(assetIndex()).slice(0,400).map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`;
function assetChange(v){const a=assetIndex()[(v.asset||'').trim()];if(a&&(v.vehicleType!==a.vehicleType||v.model!==a.model)){v.vehicleType=a.vehicleType;v.model=a.model;v.assetFound=true;return 'redraw'}if(!a&&v.assetFound){v.assetFound=false;return 'redraw'}}

function newSpeed(){const n=nowLocal();formDrawer({title:'New Speed Violation',submit:'Register violation',defaults:{date:n.date,time:n.time,assign:'Project',rental:'No',kind:'Public Road',vehicleType:'Light Vehicle',limit:'120',itqan:SETTINGS.itqanDefault?'Yes':'No'},datalists:ASSET_LIST(),

const cv=(id,h=220)=>`<div class="chart" style="height:${h}px"><canvas id="${id}"></canvas></div>`;
const gaugeBox=(id,v,lo,hi)=>`<div class="gauge"><div class="chart" style="height:150px"><canvas id="${id}"></canvas></div><div class="gv">${fmtN(v)}</div>${lo!=null?`<span class="gl" style="left:6%">${lo}</span><span class="gl" style="right:6%">${fmtN(hi)}</span>`:''}</div>`;

/* device inventory in scope */
function deviceRows(){const f=S.f;const acc=userAccess();return Object.entries(DEVICES).filter(([loc])=>(acc==='All'||acc.includes(loc))&&(f.view==='all'?true:f.view==='project'?(PROJECTS.includes(loc)&&(f.project==='All'||f.project===loc)):(DEVICE_PROJECT[loc]&&(f.dept==='All'||f.dept===DEVICE_PROJECT[loc]))))}
function deviceTotals(rows){const t=[0,0,0,0,0,0];rows.forEach(([,v])=>v.forEach((x,i)=>t[i]+=x));return t}

   ${card('Technologies used',cv('cTech',220),'','Devices deployed by type')}
   ${show(0)?locWidget(0,'AI Camera per location'):locWidget(DEVICE_TYPES.indexOf(dev),dev+' per location')}
  </div>
  <div class="grid g4">${[1,2,4,5].filter(i=>show(i)&&!(dev!=='All'&&i===DEVICE_TYPES.indexOf(dev)&&!show(0))).map(i=>locWidget(i,DEVICE_TYPES[i]+(i===5?'s':'')+' per location')).join('')}${show(3)&&dev==='All'?'':''}</div>
  ${dev==='All'?`<div class="grid g4">${locWidget(3,'Smart Helmets per location')}<div class="span3">${card('Needs attention',`<div class="grid g2">${att.map(a=>`<div class="row" style="flex-wrap:nowrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px"><span class="kpi" style="padding:0;border:0;background:none"><span class="t"><span class="ic">${I(a[0])}</span></span></span><b style="font-family:var(--f-display);font-size:28px;min-width:44px">${fmtN(a[1])}</b><span style="font-size:12.5px;color:var(--ink-2)">${a[2]}</span><button class="linkbtn" style="margin-left:auto" data-go="${a[4]}">${a[3]} →</button></div>`).join('')}</div>`,'','What is waiting for someone right now')}</div></div>`:''}
  ${card('Weekly progress: records registered, week by week',`<div class="legend" id="lgWeek"></div>${cv('cWeek',280)}`,'','Last 10 weeks by record type, with the total and the change from the previous week. Weeks start on Sunday.')}

   <tbody>${sumRows.sort((a,b)=>b.slice(1).reduce((x,y)=>x+y,0)-a.slice(1).reduce((x,y)=>x+y,0)).map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map((v,i)=>`<td class="n heat" style="--h:${(v/mx[i]*.28).toFixed(2)}"><span>${fmtN(v)}</span></td>`).join('')}<td class="n"><b>${fmtN(r.slice(1).reduce((a,b)=>a+b,0))}</b></td></tr>`).join('')}</tbody>
   <tfoot><tr><td>Total</td>${tot.map(v=>`<td class="n">${fmtN(v)}</td>`).join('')}<td class="n">${fmtN(tot.reduce((a,b)=>a+b,0))}</td></tr></tfoot></table></div>`,'','Devices deployed per project and location, shaded by share of each device type',`<button class="btn sm" id="sumExp">${I('download')} Export Excel</button>`)}`;
}
function R_prevLen(prev){return range().cmp?prev.length:null}
const WEEK_SERIES=[['AI Camera',r=>r.type==='ai'],['Dashcam',r=>r.type==='dashcam'],['Speed (Public Road)',r=>r.type==='speed'&&r.kind!=='ROW'],['ROW',r=>r.type==='speed'&&r.kind==='ROW'],['SOS (wearables)',r=>r.type==='sos'],['ITQAN',r=>r.type==='itqan']];
function devFilter(){const d=S.f.device;return d==='All'?()=>true:DEVICE_TYPEMAP[d]}
function weekCompareTable(weeks){const w=weeks.slice(-2);const df=devFilter();
  const rows=WEEK_SERIES.map(([n,f])=>{const a=weekCounts(w,r=>f(r)&&df(r));return[n,a[0],a[1]]}).filter(r=>S.f.device==='All'||r[1]+r[2]>0);
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Record type</th><th class="n">${w[0].label} (${w[0].range})</th><th class="n">${w[1].label} (to date)</th><th class="n">Change</th><th>Trend</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n"><b>${r[2]}</b></td><td class="n">${deltaChip(r[2],r[1])}</td><td>${r[2]<r[1]?'<span class="tagx green">Improving</span>':r[2]>r[1]?'<span class="tagx red">Rising</span>':'<span class="tagx">Stable</span>'}</td></tr>`).join('')}</tbody></table></div>`}

  const pr=rows.map(([l,v])=>[l,di>=0?v[di]:v.reduce((a,b)=>a+b,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

  return `<div class="grid g4">${tiles}${totTile}</div>
  <div class="grid g3">
   ${card('Overall status',`<div style="position:relative">${cv('cSt',190)}<div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center"><div><b style="font-family:var(--f-display);font-size:30px">${fmtN(recs.length)}</b><br><small class="muted">records</small></div></div></div>

/* ---------- shared module dashboard pieces ---------- */
function moduleKPIs(base,prev,extra=[]){const R=range();const st=countBy(base,r=>r.status),ps=countBy(prev,r=>r.status);
  const items=[{t:'Total',ic:'report',v:base.length,p:prev.length,s:'in the selected period'},{t:'Open',ic:'alert',v:st.Open||0,p:ps.Open||0,s:'waiting for the next step'},{t:'Under Review',ic:'clock',v:st['Under Review']||0,p:ps['Under Review']||0,s:'waiting for Admin review'},{t:'Closed',ic:'review',v:st.Closed||0,p:ps.Closed||0,s:'approved and closed',good:true},...extra];
  return `<div class="grid g${Math.min(6,items.length)}">${items.map(x=>kpi({t:x.t,ic:x.ic,v:x.raw||fmtN(x.v),s:x.s,d:x.p!=null?deltaChip(x.v,R.cmp?x.p:null,!x.good):''})).join('')}</div>`}
function statusDonutCard(id,base,sos){const sts=sos?['Open','Closed']:['Open','Under Review','Closed'];const sc=STATUS_COL();return card('Observations status',`<div style="position:relative">${cv(id,170)}<div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none"><b style="font-family:var(--f-display);font-size:26px">${fmtN(base.length)}</b></div></div><div class="legend" style="justify-content:center">${sts.map(s=>`<span><i style="background:${sc[s]}"></i>${s} <b class="mono">${fmtN(base.filter(r=>r.status===s).length)}</b> <span class="muted">${pct(base.filter(r=>r.status===s).length,base.length)}%</span></span>`).join('')}</div>`)}
function mountStatusDonut(id,base,sos){const sts=sos?['Open','Closed']:['Open','Under Review','Closed'];const sc=STATUS_COL();donut(id,sts,sts.map(s=>base.filter(r=>r.status===s).length),sts.map(s=>sc[s]),'72%')}
function riskCard(id,base,withPositive){return card('Risk level',cv(id,190),'','Number of records by risk level'+(withPositive?' and positive observations':''))}
function mountRisk(id,base,withPositive){const rc=RISK_COL();const labels=['Low','Medium','High'];const data=labels.map(k=>base.filter(r=>r.risk===k&&!(withPositive&&r.alertType==='Positive')).length);if(withPositive){labels.push('Positive');data.push(base.filter(r=>r.alertType==='Positive').length)}
  chart(id,{type:'bar',data:{labels:labels.map(l=>l==='Positive'?l:l+' Risk'),datasets:[{data,backgroundColor:labels.map(l=>rc[l]),borderRadius:5,maxBarThickness:64}]},options:{scales:axes()}})}
function curveCard(id,title){return card(title,`<div class="seg" style="align-self:flex-start" data-curve="${id}"><button class="on" data-cm="week">By week</button><button data-cm="month">By month</button></div>${cv(id,230)}`)}
function mountCurve(id,filter,color){const P=PAL();const drawW=()=>{const w=lastWeeks(12);return{labels:w.map(x=>x.label),data:weekCounts(w,filter)}};const drawM=()=>({labels:MON3.slice(0,NOW.getMonth()+1),data:monthCounts(filter)});
  let c=chart(id,{type:'line',data:{labels:drawW().labels,datasets:[lineDS('Records',drawW().data,color||P.red)]},options:{scales:axes()}});
  $$(`[data-curve="${id}"] button`).forEach(b=>b.onclick=()=>{$$(`[data-curve="${id}"] button`).forEach(x=>x.classList.toggle('on',x===b));const d=b.dataset.cm==='week'?drawW():drawM();c.data.labels=d.labels;c.data.datasets[0].data=d.data;c.update()})}
function hbarCard(id,title,entries,h){return card(title,`<div class="chart" style="height:${h||Math.max(140,entries.length*24+30)}px"><canvas id="${id}"></canvas></div>`)}
function opsCard(id,title){return card(title,cv(id,230),'','Records registered by each Operator')}
function mountOps(id,base,key='operator'){const e=sortedEntries(countBy(base,r=>r[key]),14);const P=PAL();chart(id,{type:'bar',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:e.map((_,i)=>i===0?P.red:i<3?P.copper:P.steel),borderRadius:4,maxBarThickness:36}]},options:{scales:axes({x:{ticks:{maxRotation:40,minRotation:30,font:{size:11}}}})}})}
function latestCard(base,kind,label){const r=base[0];if(!r)return card('Latest capture','<div class="empty">No records.</div>');return card('Latest capture',`<figure class="photo" data-lb="${esc(label)}" style="margin:0"><img src="${snap(r,kind)}" alt=""><figcaption><b>${r.id}</b><span>${fmtDT(r.ts)}</span></figcaption></figure><div class="row">${stChip(r.status)}${r.risk&&r.risk!=='NA'?rkChip(r.risk):''}<button class="linkbtn" style="margin-left:auto" data-open="${r.id}">Open record →</button></div>`,'','Most recent record in the selected scope')}

const REP_STATE={};
function reportList(kind){
  const out=[];const ws=weekStart(NOW).getTime();
  if(kind==='daily'){for(let i=0;i<14;i++){const a=sod(NOW).getTime()-i*DAY;out.push({id:'DR-'+dkey(new Date(a)).replace(/-/g,''),kind,a,b:a+DAY-1,scope:'All projects',label:fmtD(a),gen:i===0?null:a+DAY-60e3,status:i===0?'Compiling':'Generated'})}}
  if(kind==='weekly'){for(let i=0;i<6;i++){const a=ws-i*7*DAY;for(const p of PROJECTS){const id='WR-'+YEAR+'-W'+weekNo(new Date(a))+'-'+p.replace(/\s/g,'').slice(0,3).toUpperCase();const s=REP_STATE[id]||{};
      let status=i===0?'Compiling':i===1?(s.signed?'Signed by HSE':'Awaiting HSE signature'):'Signed by HSE';out.push({id,kind,a,b:a+7*DAY-1,scope:p,label:'Week '+weekNo(new Date(a))+' · '+fmtD(a).replace(' '+YEAR,'')+' to '+fmtD(a+6*DAY),gen:i===0?null:a+7*DAY-60e3,status,signed:s.signed||(i>1?{by:'Rene Oliveria',at:a+8*DAY+10*HOUR}:null)})}}}
  if(kind==='monthly'){for(let i=0;i<=Math.min(NOW.getMonth(),5);i++){const d=new Date(YEAR,NOW.getMonth()-i,1);const a=d.getTime(),b=new Date(YEAR,NOW.getMonth()-i+1,1).getTime()-1;for(const p of PROJECTS){const id='MR-'+YEAR+'-'+pad(d.getMonth()+1)+'-'+p.replace(/\s/g,'').slice(0,3).toUpperCase();const s=REP_STATE[id]||{};
      const status=i===0?'Compiling':s.issued?'Issued to PM':i===1?'Ready to issue':'Issued to PM';out.push({id,kind,a,b,scope:p,label:MONTHS[d.getMonth()]+' '+YEAR,gen:i===0?null:b+60e3,status,issued:s.issued||(i>1?{to:PMS[p],at:b+2*DAY}:null)})}}}
  const acc=userAccess();return acc==='All'?out:out.filter(r=>r.scope==='All projects'||acc.includes(r.scope));

function projKPIs(p,f){const fx=Object.assign({},S.f,{view:p?'project':'all',project:p||'All'});const all=sel({f:fx,noDevice:true}).filter(r=>r.type!=='itqan');
  const done=all.filter(r=>r.closeoutAt||r.type==='sos'&&r.closedAt);const onTime=done.filter(r=>((r.closeoutAt||r.closedAt)-r.ts)/HOUR<=slaHours(r)).length;
  const closeT=done.length?done.reduce((a,r)=>a+((r.closeoutAt||r.closedAt)-r.ts)/HOUR,0)/done.length:0;
  const closed=all.filter(r=>r.status==='Closed').length;const od=all.filter(r=>{const s=slaState(r);return s&&(s.k==='over'||s.k==='esc')}).length;
  const vio=all.filter(r=>r.type==='dashcam'||r.type==='speed');const conf=vio.filter(r=>r.status!=='Open');const itq=conf.filter(r=>r.itqan&&r.itqan.upload).length;
  const ai=all.filter(r=>r.type==='ai');const sl=ai.filter(r=>r.safelife&&r.safelife.update);const slDone=sl.filter(r=>r.status!=='Open').length;
  const gps=Object.entries(DEVICES).filter(([l])=>!p||l===p).reduce((a,[,v])=>a+v[1],0);const cams=Object.entries(DEVICES).filter(([l])=>!p||l===p).reduce((a,[,v])=>a+v[0],0);
  const pos=ai.filter(r=>r.alertType==='Positive').length;
  return{n:all.length,sla:pct(onTime,done.length),closeT,closure:pct(closed,all.length),od,itq:pct(itq,conf.length),sl:pct(slDone,sl.length),vp100:gps?Math.round(vio.length/gps*1000)/10:0,perCam:cams?Math.round(ai.length/cams*10)/10:0,pos:pct(pos,ai.length),vio:vio.length}}
function viewKPI(){

  const rag=(v,t,inv)=>inv?(v>=100?'green':v>=80?'amber':'red'):(v>=t?'green':v>=t*.85?'amber':'red');
  const projs=PROJECTS.map(p=>[p,projKPIs(p)]);const score=x=>Math.round(x.sla*.35+x.closure*.25+x.itq*.15+x.sl*.1+Math.max(0,100-x.od*4)*.15);
  const ranked=projs.map(([p,x])=>[p,x,score(x)]).sort((a,b)=>b[2]-a[2]);

  `<div class="grid g6">${tgt.map(([t,v,target,val,s,inv])=>`<div class="kpi"><div class="t">${t}<span class="tagx ${rag(val,target,inv)}" style="margin-left:auto">${rag(val,target,inv)==='green'?'On target':rag(val,target,inv)==='amber'?'Watch':'Off target'}</span></div><div class="v">${v}</div><div class="s">${s}</div><div class="progress" style="margin-top:4px"><i style="width:${Math.min(100,inv?val:val/Math.max(target,1)*100)}%;background:var(--${rag(val,target,inv)==='green'?'green':rag(val,target,inv)==='amber'?'amber':'red'})"></i></div><div class="s">Target ${inv?'0':target+(t==='Positive observations'?'%+':'%')}</div></div>`).join('')}</div>

}

function wxLatest(st){for(let i=0;i<5;i++){const a=WX[st.id+'|'+dkey(new Date(NOW.getTime()-i*DAY))];if(a){for(let j=a.length-1;j>=0;j--)if(a[j])return{...a[j],hour:WX_HOURS[j],day:new Date(NOW.getTime()-i*DAY)}}}return null}
function wxDaily(proj,a,b){const out=[];for(const s of STATIONS){if(proj!=='All'&&s.project!==proj)continue;for(let t=sod(new Date(a)).getTime();t<=b;t+=DAY){const arr=WX[s.id+'|'+dkey(new Date(t))];if(!arr)continue;const v=arr.filter(Boolean);if(!v.length)continue;out.push({st:s,t,T:Math.max(...v.map(x=>x.T)),RH:Math.max(...v.map(x=>x.RH)),hi:Math.max(...v.map(x=>x.hi)),wind:Math.max(...v.map(x=>x.wind)),pm25:Math.max(...v.map(x=>x.pm25)),pm10:Math.max(...v.map(x=>x.pm10)),co2:Math.max(...v.map(x=>x.co2)),n:v.length})}}return out}

/* ---------- OPERATOR PERFORMANCE (enhanced, p.37) ---------- */
function opStats(name,a,b){const reg=RECORDS.filter(r=>r.operator===name&&r.ts>=a&&r.ts<=b&&r.type!=='itqan');
  const up=RECORDS.filter(r=>(r.type==='dashcam'||r.type==='speed')&&r.confirmedBy===name&&r.closeoutAt>=a&&r.closeoutAt<=b);
  const co=RECORDS.filter(r=>((r.type==='ai'&&r.operator===name&&r.closeoutAt)||(r.type==='sos'&&r.closedBy===name))&&(r.closeoutAt||r.closedAt)>=a&&(r.closeoutAt||r.closedAt)<=b);
  const ret=reg.filter(r=>r.returned||r.history&&r.history.some(h=>/Returned/.test(h.act))).length;
  const resp=co.concat(up).map(r=>((r.closeoutAt||r.closedAt)-r.ts)/HOUR);const avg=resp.length?resp.reduce((x,y)=>x+y,0)/resp.length:0;
  const onT=co.concat(up).filter(r=>((r.closeoutAt||r.closedAt)-r.ts)/HOUR<=slaHours(r)).length;
  const t=countBy(reg,r=>r.type);return{name,reg:reg.length,ai:t.ai||0,dc:t.dashcam||0,sp:t.speed||0,sos:t.sos||0,up:up.length,co:co.length,ret,retPct:pct(ret,reg.length),avg,onT:pct(onT,co.length+up.length),total:reg.length+up.length+co.length,last:Math.max(0,...reg.map(r=>r.ts))}}

  const mxT=Math.max(1,...ops.map(o=>o.total));ops.forEach(o=>o.score=Math.round(o.total/mxT*40+o.onT*.3+(100-o.retPct)*.2+(o.up+o.dc+o.sp?Math.min(100,pct(o.up,Math.max(1,o.dc+o.sp)))*.1:10)));ops.sort((a,b)=>b.score-a.score);
  const sum=k=>ops.reduce((a,o)=>a+o[k],0),psum=k=>prevOps.reduce((a,o)=>a+o[k],0);const cmp=R.cmp;

  `<div class="grid g6">${[['Records registered','report',sum('reg'),psum('reg'),'observations, violations and SOS'],['Uploaded to ITQAN','itqan',sum('up'),psum('up'),'Confirm Driver & Submit completed'],['Close-outs','review',sum('co'),psum('co'),'AI close-outs and SOS closed'],['On-time actions','clock',Math.round(ops.reduce((a,o)=>a+o.onT,0)/Math.max(1,ops.length))+'%',null,'within the risk deadline'],['Returned by Admin','x',sum('ret'),psum('ret'),'close-outs sent back for rework'],['Active operators','users',ops.length,null,'with at least one action']].map(([t,ic,v,p,s])=>kpi({t,ic,v:typeof v==='number'?fmtN(v):v,d:p!=null&&cmp?deltaChip(v,p,t==='Returned by Admin'):'',s})).join('')}</div>
  ${card('Leaderboard',`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Operator</th><th class="n">AI Camera</th><th class="n">Dashcam</th><th class="n">Speed</th><th class="n">SOS</th><th class="n">Uploaded</th><th class="n">Close-outs</th><th class="n">On time</th><th class="n">Returned</th><th class="n">Avg response</th><th class="n">Score</th><th>Last activity</th></tr></thead><tbody>${ops.map((o,i)=>`<tr class="clk" data-op="${o.name}"><td>${i<3?`<span class="tagx ${i===0?'red':'amber'}">#${i+1}</span>`:`<b class="mono">#${i+1}</b>`}</td><td><b>${o.name}</b></td><td class="n">${o.ai}</td><td class="n">${o.dc}</td><td class="n">${o.sp}</td><td class="n">${o.sos}</td><td class="n">${o.up}</td><td class="n">${o.co}</td><td class="n">${o.onT}%</td><td class="n">${o.retPct}%</td><td class="n">${fmtDur(o.avg)}</td><td class="n"><span class="tagx ${o.score>=75?'green':o.score>=55?'amber':'red'}">${o.score}</span></td><td class="muted">${o.last?fmtDT(o.last):'—'}</td></tr>`).join('')}</tbody></table></div>`,'','Score = volume 40% · on-time 30% · quality (not returned) 20% · ITQAN follow-through 10%.',`<button class="btn sm" id="opExp">${I('download')} Export Excel</button>`)}

  chart('cOpW',{type:'line',data:{labels:w.map(x=>x.label),datasets:[lineDS('Registered',reg,P.ink2),lineDS('Uploaded to ITQAN',up,P.red,false),lineDS('Close-outs',co,P.green,false)]},options:{scales:axes(),plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10}}}}});}

const hr12=h=>(h>12?h-12:h)+':00 '+(h>=12?'PM':'AM');
function wxDayMax(st,t){const a=(WX[st.id+'|'+dkey(new Date(t))]||[]).filter(Boolean);if(!a.length)return null;const m=k=>Math.max(...a.map(x=>+x[k]||0));return{n:a.length,wind:m('wind'),T:m('T'),RH:m('RH'),co2:m('co2'),pm25:m('pm25'),pm10:m('pm10'),hi:m('hi')}}
function repWeather(rep){

  if(rep.kind==='weekly')return `<h2>Weather monitoring · highest readings per day</h2>${sts.map(s=>`<p style="margin:8px 0 4px"><b>${esc(s.loc)}</b> · ${s.project} · Week ${weekNo(new Date(rep.a))}</p><table><thead><tr><th>Day</th><th class="n">Hours logged</th><th class="n">Max wind (m/s)</th><th class="n">Max temp (°C)</th><th class="n">Max humidity (%)</th><th class="n">Max CO2 (ppm)</th><th class="n">Max PM10</th><th class="n">Max heat index</th><th>Category</th></tr></thead><tbody>${[0,1,2,3,4,5,6].map(i=>{const t=rep.a+i*DAY;const m=wxDayMax(s,t);return m?`<tr><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]} ${fmtD(t)}</td><td class="n">${m.n} / ${WX_HOURS.length}</td><td class="n">${m.wind}</td><td class="n">${m.T}</td><td class="n">${m.RH}</td><td class="n">${m.co2}</td><td class="n">${m.pm10}</td><td class="n"><b>${m.hi}</b></td><td>${hiCat(m.hi).n}</td></tr>`:`<tr><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]} ${fmtD(t)}</td><td colspan="8" style="color:#7c777b">${t>NOW.getTime()?'Not due yet':'No readings logged'}</td></tr>`}).join('')}</tbody></table>`).join('')}`;

   ${[0,1,2,3,4,5,6].map(i=>{const t=a+i*DAY;const m=wxDayMax(s,t);const c=m?hiCat(m.hi):null;return `<tr>${i===0?`<td rowspan="7">${esc(s.loc)}</td><td rowspan="7">${project}</td><td rowspan="7">Week ${weekNo(new Date(a))}<br><small class="muted">Table ${ti+1} of ${sts.length}</small></td>`:''}<td class="t">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]} ${fmtD(t).replace(' '+YEAR,'')}</td>${m?`<td class="mono">${m.wind}</td><td class="mono">${m.T}</td><td class="mono">${m.RH}</td><td class="mono">${m.co2}</td><td class="mono">${m.pm10}</td><td class="mono" style="background:${['var(--surface-2)','#F6E7A6','#F4BE7E','#E5604F','#8E0B20'][c.c]};${c.c>=3?'color:#fff':''};font-weight:700">${m.hi}</td><td style="text-align:left;font-size:11.5px"><span class="hicat c${c.c}">${c.n}</span> ${c.p}</td><td class="mono">${m.n} / ${WX_HOURS.length}</td>`:`<td colspan="8" class="muted">${t>NOW.getTime()?'Not due yet':'No readings logged'}</td>`}</tr>`}).join('')}</tbody></table></div>`).join('')}

function auditRows(){const recs=RECORDS.flatMap(r=>(r.history||[]).map(h=>({at:h.at,by:h.by,act:h.act.split(':')[0],id:r.id,det:TYPE_LABEL[r.type]+', '+scopeOf(r),mod:TYPE_LABEL[r.type]})));
  const hw=HW_LOG.map(h=>({at:h.at,by:h.by,act:'SCC HW change',id:h.serial||h.loc,det:`${h.loc} · ${h.type} · ${h.st} ${h.from}→${h.to} · ${h.why}`,mod:'SCC HW'}));
  const COVERED=/^(Registered|Close-out submitted|Approved and closed|Returned to Operator|Confirm Driver & Submit|SOS alert closed|SCC HW: Inventory change)/;const ad=AUDIT.filter(a=>!COVERED.test(a.act)).map(a=>({...a,mod:/^SCC HW/.test(a.act)?'SCC HW':/weather/i.test(a.act)?'Weather Monitoring':/SafeLife|ITQAN/.test(a.act)?'Records':/user|access|role/i.test(a.act)?'Users & access':'Administration'}));
  const seen=new Set();return [...ad,...hw,...recs].filter(x=>{const k=x.at+'|'+x.act+'|'+x.id;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.at-a.at)}
function auditHTML(){const st=S.sub.au=S.sub.au||{q:'',mod:'All',p:0};let rows=auditRows();const mods=['All',...new Set(rows.map(r=>r.mod))];
  if(st.mod!=='All')rows=rows.filter(r=>r.mod===st.mod);if(st.q){const q=st.q.toLowerCase();rows=rows.filter(r=>(r.by+' '+r.act+' '+r.id+' '+r.det).toLowerCase().includes(q))}
  const per=25,pages=Math.max(1,Math.ceil(rows.length/per));if(st.p>=pages)st.p=pages-1;
  return card('Audit log',`<div class="row"><select class="sel" id="auM" aria-label="Module">${mods.map(m=>`<option ${st.mod===m?'selected':''}>${m}</option>`).join('')}</select><div class="search" style="width:260px"><span>${I('search')}</span><input id="auQ" value="${esc(st.q)}" placeholder="User, action or case ID" aria-label="Search audit log"></div><span style="flex:1"></span><button class="btn sm" id="auExp">${I('download')} Export Excel</button></div>

   <div class="pager"><span>${fmtN(rows.length)} entries · page ${st.p+1} of ${pages}</span><button class="btn sm" data-aup="-1" ${st.p===0?'disabled':''}>Previous</button><button class="btn sm" data-aup="1" ${st.p>=pages-1?'disabled':''}>Next</button></div>`,'','Every action in the platform with who did it and when: records, approvals, deletions, settings, user changes and SCC HW updates. Entries cannot be edited.')}

const hwChip=st=>{const c=(HW_ST.find(x=>x[0]===st)||[0,'#7B61FF'])[1];return `<span class="st" style="background:${c}22;color:${c}">${esc(st)}</span>`};
function hwAgg(){const h=H(),types=hwTypesSel(),st=[0,0,0,0,0,0],byType={};const locs=h.view==='project'&&h.loc?[h.loc]:hwLocs();const f=t=>h.view==='dept'&&h.dept?hwShare(t,h.dept):1;
  types.forEach(t=>{byType[t]=[0,0,0,0,0,0];locs.forEach(l=>six(t,HWD[l][t]).forEach((v,k)=>byType[t][k]+=v*f(t)));byType[t]=byType[t].map(Math.round);byType[t].forEach((v,k)=>st[k]+=v)});
  const focus=h.view==='project'&&h.loc?h.loc:h.view==='dept'&&h.dept?h.dept:null;let byLoc={};
  if(focus)types.forEach(t=>byLoc[t]=byType[t]);
  else if(h.view==='dept')DEPARTMENTS.forEach(d=>{byLoc[d]=[0,0,0,0,0,0];types.forEach(t=>hwLocs().forEach(l=>six(t,HWD[l][t]).forEach((v,k)=>byLoc[d][k]+=v*hwShare(t,d))));byLoc[d]=byLoc[d].map(Math.round)});
  else hwLocs().forEach(l=>{byLoc[l]=[0,0,0,0,0,0];types.forEach(t=>six(t,HWD[l][t]).forEach((v,k)=>byLoc[l][k]+=v))});
  return{st,byLoc,byType,total:hwSum(st),focus}}
function hwLogAdd(e){HW_LOG.unshift(Object.assign({at:Date.now()},e));audit('SCC HW: '+(e.act||'Inventory change'),e.serial||e.loc,`${e.loc} · ${e.type} · ${e.st} ${e.from}→${e.to} · ${e.why}`,e.by)}
const DEV_ICON={'AI Camera':'cctv','Edge Server':'server','Router':'router','NVR':'server','Smart Helmet':'helmet','Smart Watch':'watch','Weather Station':'weather','GPS':'gps','Dashcam':'cam','Weight Sensor':'scale','PWAS':'alert'};

   `<div class="tabs">${tabs.map(([k,l,n])=>`<button data-hwt="${k}" class="${h.tab===k?'on':''}">${l}${n?` <span class="pill" style="background:var(--amber-soft);color:var(--amber)">${n}</span>`:''}</button>`).join('')}</div>`+fb+body;

   <div class="kpi"><div class="t">Assigned</div><div class="v">${fmtN(A.st[1])}</div><div class="s">${pc(A.st[1])}% · smart watches and helmets</div><div class="progress"><i style="width:${pc(A.st[1])}%;background:${HW_ST[1][1]}"></i></div></div>
   <div class="kpi"><div class="t">In Stock</div><div class="v">${fmtN(A.st[2])}</div><div class="s">ready to deploy · ${pend.length} transfer${pend.length===1?'':'s'} in transit</div></div>
   <div class="kpi"><div class="t">Out of service</div><div class="v" style="color:var(--red)">${fmtN(out)}</div><div class="s">${fmtN(A.st[3])} under maintenance · ${fmtN(A.st[4])} damaged · ${fmtN(A.st[5])} lost</div></div></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
   ${card('Devices by status',`<div style="position:relative">${cv('cHWst',200)}<div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center"><div><b style="font-family:var(--f-display);font-size:30px">${fmtN(A.total)}</b><br><small class="muted">devices</small></div></div></div>
     <div class="bars">${A.st.map((v,k)=>`<div class="bar clk" data-hwst="${HW_ST[k][0]}"><span class="l"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${HW_ST[k][1]};margin-right:6px"></i>${HW_ST[k][0]}</span><span class="tr"><i style="width:${(v/T*100).toFixed(1)}%;background:${HW_ST[k][1]}"></i></span><span class="v">${fmtN(v)}</span></div>`).join('')}</div>`,'','Select a status to see where those devices are')}
   ${card(A.focus?'Devices at '+A.focus:H().view==='dept'?'Devices by department':'Devices by project',`<div class="legend">${HW_ST.map(s=>`<span><i style="background:${s[1]}"></i>${s[0]}</span>`).join('')}</div>
     <div class="bars">${locs.map(l=>{const tot=hwSum(A.byLoc[l]);return `<div class="bar clk" data-hwp="${esc(l)}" title="${esc(l)}"><span class="l"><b>${esc(l)}</b></span><span class="tr" style="display:flex;background:transparent"><span style="display:flex;width:${Math.max(2,tot/mx*100)}%;height:100%;border-radius:5px;overflow:hidden">${A.byLoc[l].map((v,k)=>v?`<span style="width:${v/(tot||1)*100}%;background:${HW_ST[k][1]}"></span>`:'').join('')}</span></span><span class="v">${fmtN(tot)}</span></div>`}).join('')}</div>`,'',A.focus?'By device, split by status':'Split by status. Select a row to see what it has')}</div>
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
   ${card('Device health by type',`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Device</th><th>System</th><th class="n">Total</th><th class="n">Installed</th><th class="n">Assigned</th><th class="n">In stock</th><th class="n">Maint.</th><th class="n">Damaged</th><th class="n">Lost</th><th>In service</th></tr></thead><tbody>${Object.keys(A.byType).map(t=>{const r=A.byType[t],tot=hwSum(r)||1,w=WEAR.includes(t),p=Math.round((r[0]+r[1])/tot*100);return `<tr><td><b>${t}</b></td><td>${HW_SYS(t)}</td><td class="n">${fmtN(hwSum(r))}</td><td class="n">${w?'–':fmtN(r[0])}</td><td class="n">${w?fmtN(r[1]):'–'}</td><td class="n">${fmtN(r[2])}</td><td class="n">${fmtN(r[3])}</td><td class="n" style="${r[4]?'color:var(--red);font-weight:700':''}">${fmtN(r[4])}</td><td class="n" style="${r[5]?'color:var(--red);font-weight:700':''}">${fmtN(r[5])}</td><td><div class="row" style="flex-wrap:nowrap"><span class="progress"><i style="width:${p}%;background:${w?HW_ST[1][1]:HW_ST[0][1]}"></i></span><span class="mono" style="font-size:12px">${p}%</span></div></td></tr>`}).join('')}</tbody></table></div>`,'','How many of each device are in use, in stock or out of service')}

function mountHW(){const h=H();
  $$('[data-hwt]').forEach(b=>b.onclick=()=>{h.tab=b.dataset.hwt;render()});
  $$('[data-hwv]').forEach(b=>b.onclick=()=>{h.view=b.dataset.hwv;h.loc=null;h.dept=null;render()});
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onchange=()=>{f(e.value);render()}};
  on('hwLoc',v=>h.loc=v||null);on('hwDept',v=>h.dept=v||null);on('hwPer',v=>h.period=v);on('hwDev',v=>h.device=v);on('hwSt',v=>h.status=v);
  const q=$('#hwQ');if(q){let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{h.q=q.value.trim().toLowerCase();render();const n=$('#hwQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)},300)}}
  [$('#hwTrfBtn'),$('#hwTrfBtn2')].forEach(b=>{if(b)b.onclick=hwTransferDialog});
  $$('[data-hwst]').forEach(b=>b.onclick=()=>{h.status=b.dataset.hwst;h.tab='summary';render();toast('Showing '+h.status+' devices per project')});
  $$('[data-hwp]').forEach(b=>b.onclick=()=>{const n=b.dataset.hwp;if(HW_TYPES.includes(n)){h.device=h.device===n?'All':n}else if(h.view==='dept'){h.dept=n}else{h.view='project';h.loc=n}render()});
  $$('[data-hwdev]').forEach(b=>b.onclick=()=>{const d=b.dataset.hwdev;if(d==='All'){h.device='All';h.status='All'}else h.device=h.device===d?'All':d;render()});
  $$('[data-hwcell]').forEach(c=>c.onclick=()=>{const[l,t]=c.dataset.hwcell.split('|');h.view='project';h.loc=l;h.device=t;h.tab='register';render()});
  $$('[data-hwser]').forEach(b=>b.onclick=()=>hwDeviceDialog(b.dataset.hwser,b.dataset.mode));
  $$('[data-hwrcv]').forEach(b=>b.onclick=()=>hwReceiptDialog(b.dataset.hwrcv));
  $$('[data-hwrm]').forEach(b=>b.onclick=()=>hwRemoveDialog(b.dataset.hwrm));
  $$('[data-hwapp]').forEach(b=>b.onclick=()=>{const q=HW_REQS.find(x=>x.id===b.dataset.hwapp);const d=HW_REG.find(x=>x.serial===q.serial);hwMove(d,q.to,q.toLoc,`${q.reason} (requested by ${q.by})`,S.user);q.state='approved';toast('Approved: '+d.serial+' is now '+q.to);render()});
  $$('[data-hwrej]').forEach(b=>b.onclick=()=>{const q=HW_REQS.find(x=>x.id===b.dataset.hwrej);q.state='rejected';audit('SCC HW: request rejected',q.serial,q.from+' → '+q.to+' · '+q.reason);toast('Rejected: '+q.serial+' stays '+q.from);render()});
  [$('#hwImp'),$('#hwImp2')].forEach(b=>{if(b)b.onclick=()=>{if(S.role!=='Admin')return;const f=$('#hwFile')||(()=>{const i=document.createElement('input');i.type='file';i.id='hwFile';i.accept='.xlsx,.csv';i.hidden=true;document.body.appendChild(i);return i})();f.value='';f.onchange=hwImport;f.click()}});
  const tpl=$('#hwTpl');if(tpl)tpl.onclick=hwTemplate;
  const ex=$('#hwExp');if(ex)ex.onclick=()=>xlsxOut('SCC_HW_Device_Register.xlsx','Device Register',[['Device','System','Serial Number','Status','Project','Last Updated'],...HW_REG.map(d=>[d.type,HW_SYS(d.type),d.serial,d.st,d.loc,fmtD(d.upd)])]);
  const es=$('#hwExpS');if(es)es.onclick=()=>xlsxOut('SCC_HW_Dashboard_Summary.xlsx','Dashboard Summary',[['Project / location',...HW_TYPES,'Total'],...hwLocs().map(l=>[l,...HW_TYPES.map(t=>hwCnt(l,t)),hwSum(HW_TYPES.map(t=>hwCnt(l,t)))])]);
  const eh=$('#hwExpH');if(eh)eh.onclick=()=>xlsxOut('SCC_HW_Change_History.xlsx','Change History',[['Date and time','Location','Device','Status','From','To','Reason','Confirmed by'],...HW_LOG.map(r=>[fmtDT(r.at),r.loc,r.type,r.st,r.from,r.to,r.why,r.by])]);
  const ad=$('#hwAdd');if(ad)ad.onclick=hwAddDialog;
  const P=PAL();
  if(h.tab==='dash'){const A=hwAgg();donut('cHWst',HW_ST.map(s=>s[0]),A.st,HW_ST.map(s=>s[1]),'70%');
    const m=NOW.getMonth()+1;const inuse=A.st[0]+A.st[1];const ser=[...Array(m)].map((_,i)=>i===m-1?inuse:Math.round(inuse*(.86+.14*i/(m-1))));
    chart('cHWtr',{type:'line',data:{labels:MON3.slice(0,m),datasets:[lineDS('In use',ser,P.red)]},options:{scales:axes({y:{beginAtZero:false}})}})}
}
/* status / location change on one device keeps counts in step */
function hwMove(d,nst,nloc,why,by){const o=hwStatusIdx(d.st),n=hwStatusIdx(nst);const fo=HWD[d.loc][d.type][o],fn=HWD[nloc][d.type][n];
  if(d.st!=='Not registered')HWD[d.loc][d.type][o]=Math.max(0,fo-1);HWD[nloc][d.type][n]+=1;
  hwLogAdd({loc:nloc,type:d.type,st:d.st===nst?nst:`${d.st} → ${nst}`,from:fn,to:HWD[nloc][d.type][n],why:`${d.serial}: ${why}${nloc!==d.loc?' (moved from '+d.loc+')':''}`,by,serial:d.serial});
  d.st=nst;d.loc=nloc;d.upd=Date.now();syncDeviceInventory()}

/* ---------- Update hardware: two-step form to change a device count ---------- */
const HW_REASONS=['New delivery received','Device installed or assigned','Returned to stock','Sent for maintenance','Returned from maintenance','Damaged or faulty','Lost or stolen','Count correction after physical audit','Device retired / disposed'];
function hwUpdateDialog(loc,type){if(S.role!=='Admin')return toast('Only an Admin can update hardware counts.');
  const locs=hwLocs();const h=H();const v={loc:loc||h.loc||locs[0],type:type||(h.device!=='All'?h.device:'AI Camera'),st:'',nv:'',why:'',ref:'',det:'',sn:''};v.st=stList(v.type)[0];
  const d=openDialog(`<div class="row" style="gap:6px"><span class="tagx red" id="s1">1 Details</span><span class="tagx" id="s2">2 Confirm reason</span></div><h3>${I('server')} Update hardware</h3>
   <div id="uStep1"><div class="fgrid">
    <div class="fld"><label for="uL">Project / location <span class="req">*</span></label><select id="uL">${locs.map(l=>`<option ${l===v.loc?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="fld"><label for="uT">Device type <span class="req">*</span></label><select id="uT">${HW_GROUPS.map(([g,ts])=>`<optgroup label="${g}">${ts.map(t=>`<option ${t===v.type?'selected':''}>${t}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div class="fld full"><label for="uS">Status <span class="req">*</span></label><select id="uS"></select></div>
    <div class="fld"><label for="uC">Current count</label><input id="uC" readonly></div>
    <div class="fld"><label for="uN">New count <span class="req">*</span></label><input id="uN" type="number" min="0"><span class="hint" id="uDiff"></span></div>
    <div class="fld"><label for="uW">Reason for the change <span class="req">*</span></label><select id="uW"><option value="">Select a reason</option>${HW_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="fld"><label for="uR">Reference number <span class="req">*</span></label><input id="uR" placeholder="Delivery note, WO, MOC or incident no."></div>
    <div class="fld full"><label for="uSn">Serial numbers <span class="req">*</span></label><textarea id="uSn" placeholder="One serial number per line. The count must match the change."></textarea><span class="hint" id="uSnH"></span></div>
    <div class="fld full"><label for="uDt">Details <span class="req">*</span></label><textarea id="uDt" placeholder="What happened, where, serial numbers if known"></textarea></div>
    <div class="fld full"><label>Updated by</label><input readonly value="${esc(S.user)}"></div></div>
    <div class="row" style="justify-content:space-between"><span class="msg muted" id="uMsg" style="font-size:12px"></span><span class="row"><button class="btn" id="uX">Cancel</button><button class="btn pri" id="uNext" disabled>Review change</button></span></div></div>
   <div id="uStep2" hidden><div class="kv one" id="uSum"></div><label class="row" style="font-size:13px"><input type="checkbox" id="uOk"> I confirm the reason above is correct, and the evidence is available on request.</label>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="uBack">Back</button><button class="btn pri" id="uSave" disabled>${I('check')} Confirm and save</button></div></div>`);
  const cur=()=>HWD[v.loc][v.type][hwStatusIdx(v.st)];
  const fillSt=()=>{$('#uS').innerHTML=stList(v.type).map(s=>`<option ${s===v.st?'selected':''}>${s}</option>`).join('');if(!stList(v.type).includes(v.st)){v.st=stList(v.type)[0];$('#uS').value=v.st}$('#uC').value=cur();chk()};
  const sers=()=>[...new Set(v.sn.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
  const serErr=()=>{const n=parseInt(v.nv,10),c=cur();if(Number.isNaN(n)||n===c)return '';const need=Math.abs(n-c),list=sers();if(list.length!==need)return `Enter ${need} serial number${need===1?'':'s'} (${list.length} entered)`;
    if(n>c){const dup=list.filter(x=>HW_REG.some(d=>d.serial.toLowerCase()===x.toLowerCase()&&!(d.loc===v.loc&&d.type===v.type&&d.st!==v.st)));if(dup.length)return 'Already registered elsewhere: '+dup.join(', ')}
    else{const bad=list.filter(x=>{const d=HW_REG.find(r=>r.serial.toLowerCase()===x.toLowerCase());return d&&!(d.loc===v.loc&&d.type===v.type&&d.st===v.st)});if(bad.length)return 'Registered with another project, device or status: '+bad.join(', ')}
    return ''};
  const chk=()=>{const n=parseInt(v.nv,10);const c=cur();
    const reg=HW_REG.filter(d=>d.loc===v.loc&&d.type===v.type&&d.st===v.st).map(d=>d.serial);const se=serErr();
    $('#uSnH').innerHTML=(Number.isNaN(n)||n===c?'Enter the new count first. ':n>c?`Adding ${n-c}: enter the serial numbers of the devices being added. `:`Removing ${c-n}: enter the serial numbers of the devices leaving this status. `)+(reg.length?`Registered here: <span class="mono">${reg.slice(0,8).join(', ')}${reg.length>8?' …':''}</span>`:'')+(se?`<br><b style="color:var(--red)">${se}</b>`:'');$('#uDiff').textContent=Number.isNaN(n)?'':n===c?'Same as the current count':(n>c?'+':'')+(n-c)+' devices';
    const miss=[Number.isNaN(n)||n<0||n===c,!v.why,v.ref.trim().length<2,v.det.trim().length<5,!!serErr()].filter(Boolean).length;$('#uNext').disabled=!!miss;$('#uMsg').textContent=miss?miss+' required field'+(miss>1?'s are':' is')+' still empty or unchanged':'Ready to review'};
  $('#uL').onchange=e=>{v.loc=e.target.value;fillSt()};$('#uT').onchange=e=>{v.type=e.target.value;fillSt()};$('#uS').onchange=e=>{v.st=e.target.value;$('#uC').value=cur();chk()};
  $('#uN').oninput=e=>{v.nv=e.target.value;chk()};$('#uW').onchange=e=>{v.why=e.target.value;chk()};$('#uR').oninput=e=>{v.ref=e.target.value;chk()};$('#uDt').oninput=e=>{v.det=e.target.value;chk()};$('#uSn').oninput=e=>{v.sn=e.target.value;chk()};fillSt();
  $('#uX').onclick=closeDialog;
  $('#uNext').onclick=()=>{const c=cur(),n=parseInt(v.nv,10);$('#uSum').innerHTML=[['Location',v.loc],['Device',v.type],['Status',v.st],['Change',`<span class="mono">${c} → ${n} (${n>c?'+':''}${n-c})</span>`],['Reason',esc(v.why)],['Reference',esc(v.ref)],['Serial numbers',`<span class="mono">${esc(sers().join(', '))}</span>`],['Details',esc(v.det)],['Updated by',esc(S.user)]].map(([k,x])=>`<div><span>${k}</span><b>${x}</b></div>`).join('');
    $('#uStep1').hidden=true;$('#uStep2').hidden=false;$('#s1').className='tagx';$('#s2').className='tagx red';$('#uOk').checked=false;$('#uSave').disabled=true};
  $('#uBack').onclick=()=>{$('#uStep1').hidden=false;$('#uStep2').hidden=true;$('#s1').className='tagx red';$('#s2').className='tagx'};
  $('#uOk').onchange=e=>$('#uSave').disabled=!e.target.checked;
  $('#uSave').onclick=()=>{const k=hwStatusIdx(v.st),c=HWD[v.loc][v.type][k],n=parseInt(v.nv,10);HWD[v.loc][v.type][k]=n;const list=sers();
    if(n>c)list.forEach(x=>{const d=HW_REG.find(r=>r.serial.toLowerCase()===x.toLowerCase());if(d){d.st=v.st;d.upd=Date.now()}else HW_REG.unshift({type:v.type,serial:x,st:v.st,loc:v.loc,upd:Date.now(),seen:null})});
    else list.forEach(x=>{const i=HW_REG.findIndex(r=>r.serial.toLowerCase()===x.toLowerCase());if(i>=0)HW_REG.splice(i,1)});
    hwLogAdd({loc:v.loc,type:v.type,st:v.st,from:c,to:n,why:`${v.why} · ${v.ref} · ${n>c?'added':'removed'}: ${list.join(', ')} · ${v.det}`,by:S.user,act:'Count updated',serial:list.join(', ')});syncDeviceInventory();closeDialog();
    toast(`${v.loc}: ${v.type} (${v.st}) changed from ${c} to ${n}. Logged in Change History.`);render()}}

/* ---------- transfers ---------- */
function hwTransferDialog(){if(S.role!=='Admin')return;
  const d=openDialog(`<h3>${I('truck')} New material transfer</h3><div class="fgrid"><div class="fld full"><label for="tK">Transfer type</label><select id="tK"><option value="delivery">Delivery from warehouse</option><option value="shift">Shift between projects</option></select></div>
   <div class="fld"><label for="tF">From</label><select id="tF"></select></div><div class="fld"><label for="tT">To</label><select id="tT">${HW_LOCS.map(l=>`<option>${l}</option>`).join('')}</select></div>
   <div class="fld"><label for="tY">Device type</label><select id="tY">${HW_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fld"><label for="tQ">Quantity</label><input id="tQ" type="number" min="1"><span class="hint" id="tAv"></span></div>
   <div class="fld full"><label for="tS">Serial numbers</label><textarea id="tS" placeholder="One serial number per line. The count must match the quantity."></textarea><span class="hint" id="tSH"></span></div>
   <div class="fld full"><label for="tR">Reason</label><input id="tR" placeholder="Why the material is moving"></div>
   <div class="fld"><label for="tSn">Sender</label><input id="tSn" value="${esc(S.user)}" readonly></div><div class="fld"><label for="tRn">Receiver name</label><input id="tRn" placeholder="Name of the receiver at site"></div></div>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="tX">Cancel</button><button class="btn pri" id="tGo">${I('send')} Send transfer</button></div>`);
  const fill=()=>{const k=$('#tK').value;$('#tF').innerHTML=k==='delivery'?'<option>Warehouse</option>':HW_LOCS.map(l=>`<option>${l}</option>`).join('');$('#tF').disabled=k==='delivery';hint()};
  const hint=()=>{const k=$('#tK').value,f=$('#tF').value,t=$('#tY').value;$('#tAv').textContent=k==='shift'?`${HWD[f][t][1]} in stock at ${f}`:'Sent from the warehouse';const av=HW_REG.filter(x=>x.loc===f&&x.type===t&&x.st==='In Stock').map(x=>x.serial);$('#tSH').textContent=k==='shift'?(av.length?'Registered in stock at '+f+': '+av.join(', '):'No '+t+' serial numbers are registered in stock at '+f+'.'):'New devices: enter the serial numbers from the delivery note.'};
  $('#tK').onchange=fill;$('#tF').onchange=hint;$('#tY').onchange=hint;fill();$('#tX').onclick=closeDialog;
  $('#tGo').onclick=()=>{const k=$('#tK').value,from=$('#tF').value,to=$('#tT').value,type=$('#tY').value,q=parseInt($('#tQ').value,10);
    if(k==='shift'&&from===to)return toast('Choose a different project to send to.');if(!(q>=1))return toast('Enter a quantity of 1 or more.');
    const sers=[...new Set($('#tS').value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];if(sers.length!==q)return toast(`Enter ${q} serial number${q===1?'':'s'} to match the quantity. You entered ${sers.length}.`);
    if(k==='shift'){const bad=sers.filter(x=>!HW_REG.some(r=>r.serial===x&&r.loc===from&&r.type===type&&r.st==='In Stock'));if(bad.length)return toast('Not registered in '+from+' stock: '+bad.join(', '))}else{const dup=sers.filter(x=>HW_REG.some(r=>r.serial===x));if(dup.length)return toast('Already registered: '+dup.join(', '))}
    if($('#tR').value.trim().length<3)return toast('Write the reason for the transfer.');if(!$('#tRn').value.trim())return toast("Enter the receiver's name.");
    const id='TRF-'+String(hwTrfSeq++).padStart(4,'0');
    if(k==='shift'){const f0=HWD[from][type][1];HWD[from][type][1]=Math.max(0,f0-q);sers.forEach(x=>{const r=HW_REG.find(y=>y.serial===x);r.st='In transit';r.upd=Date.now()});hwLogAdd({loc:from,type,st:'In Stock',from:f0,to:HWD[from][type][1],why:`Dispatched to ${to} (${id}): ${sers.join(', ')}`,by:S.user});syncDeviceInventory()}
    HW_TRF.unshift({id,at:Date.now(),kind:k,from,to,type,qty:q,serials:sers,reason:$('#tR').value.trim(),sender:S.user,recv:$('#tRn').value.trim(),status:'transit'});audit('SCC HW: transfer sent',id,`${q} ${type} ${from} → ${to}`);
    closeDialog();H().tab='transfers';toast(`${id}: ${q} ${type} sent to ${to}. Waiting for the receiver to confirm receipt.`);render()}}
function hwReceiptDialog(id){const t=HW_TRF.find(x=>x.id===id);
  const d=openDialog(`<h3>Confirm receipt</h3><div class="kv one"><div><span>Transfer</span><b class="mono">${t.id}</b></div><div><span>From → To</span><b>${t.from} → ${t.to}</b></div><div><span>Device</span><b>${t.type}</b></div><div><span>Sent by</span><b>${esc(t.sender)}</b></div><div><span>Quantity sent</span><b>${t.qty}</b></div><div><span>Reason</span><b>${esc(t.reason)}</b></div></div>
   <div class="fld"><label>Serial numbers received</label><div class="note" style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">${t.serials.map(x=>`<label class="row" style="gap:6px;flex-wrap:nowrap"><input type="checkbox" data-rs="${x}" checked><span class="mono" style="font-size:12px">${x}</span></label>`).join('')}</div><span class="hint" id="rC"></span></div>
   <div class="fgrid"><div class="fld"><label for="rCo">Condition</label><select id="rCo"><option>Good</option><option>Some items damaged</option></select></div><div class="fld"><label for="rBy">Received by</label><input id="rBy" value="${esc(S.user)}" readonly></div></div>
   <div class="fld"><label for="rN">Notes</label><textarea id="rN" placeholder="Missing or damaged items, serial numbers"></textarea></div><label class="row" style="font-size:13px"><input type="checkbox" id="rOk"> I confirm I have received the material listed above.</label>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="rX">Cancel</button><button class="btn pri" id="rGo" disabled>${I('check')} Confirm receipt</button></div>`);
  const upd=()=>{const n=$$('[data-rs]:checked',d).length;$('#rC').textContent=n+' of '+t.qty+' ticked. Untick any serial number that did not arrive.'};$$('[data-rs]',d).forEach(c=>c.onchange=upd);upd();
  $('#rOk').onchange=e=>$('#rGo').disabled=!e.target.checked;$('#rX').onclick=closeDialog;
  $('#rGo').onclick=()=>{const got=$$('[data-rs]:checked',d).map(i=>i.dataset.rs),miss=t.serials.filter(x=>!got.includes(x));const d0=HWD[t.to][t.type][1];HWD[t.to][t.type][1]=d0+got.length;
    got.forEach(x=>{const r=HW_REG.find(y=>y.serial===x);if(r){r.loc=t.to;r.st='In Stock';r.upd=Date.now()}else HW_REG.unshift({type:t.type,serial:x,st:'In Stock',loc:t.to,upd:Date.now(),seen:null})});
    hwLogAdd({loc:t.to,type:t.type,st:'In Stock',from:d0,to:d0+got.length,why:`Receipt of ${t.id} (from ${t.from}, sent by ${t.sender}): ${got.length} of ${t.qty} received${miss.length?'; missing '+miss.join(', '):''}${$('#rCo').value!=='Good'?'; some items damaged':''}`,by:S.user});
    t.status=miss.length?'variance':'received';t.got=got.length;t.on=Date.now();t.recv=S.user;t.missing=miss;syncDeviceInventory();closeDialog();
    toast(miss.length?`${t.id}: ${miss.length} serial number(s) not received. Flagged for the SCC Manager.`:`${t.id} received in full. Counts updated automatically.`);render()}}
/* ---------- device dialogs ---------- */
function hwDeviceDialog(serial,mode){const dv=HW_REG.find(x=>x.serial===serial);const req=mode==='request';
  const d=openDialog(`<h3>${req?'Request a status change':'Change device status'}</h3><div class="kv one"><div><span>Device</span><b>${dv.type}</b></div><div><span>Serial number</span><b class="mono">${dv.serial}</b></div><div><span>Current status</span><b>${dv.st}</b></div><div><span>Project</span><b>${dv.loc}</b></div></div>
   <div class="fgrid"><div class="fld"><label for="dS">New status</label><select id="dS">${stList(dv.type).map(s=>`<option ${s===dv.st?'selected':''}>${s}</option>`).join('')}</select></div><div class="fld"><label for="dL">Project</label><select id="dL">${HW_LOCS.map(l=>`<option ${l===dv.loc?'selected':''}>${l}</option>`).join('')}</select></div></div>
   <div class="fld"><label for="dR">Reason</label><textarea id="dR" placeholder="What happened, work order or incident number"></textarea></div><label class="row" style="font-size:13px"><input type="checkbox" id="dOk"> I confirm the reason above is correct.</label>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="dX">Cancel</button><button class="btn pri" id="dGo" disabled>${req?'Send request':'Confirm and save'}</button></div>`);
  $('#dOk').onchange=e=>$('#dGo').disabled=!e.target.checked;$('#dX').onclick=closeDialog;
  $('#dGo').onclick=()=>{const ns=$('#dS').value,nl=$('#dL').value,r=$('#dR').value.trim();if(ns===dv.st&&nl===dv.loc)return toast('Choose a new status or project.');if(r.length<5)return toast('Write the reason for the change.');
    if(req){HW_REQS.unshift({id:'REQ-'+String(hwReqSeq++).padStart(3,'0'),serial:dv.serial,type:dv.type,from:dv.st,to:ns,loc:dv.loc,toLoc:nl,reason:r,by:S.user,at:Date.now(),state:'pending'});audit('SCC HW: status change requested',dv.serial,dv.st+' → '+ns);closeDialog();toast('Request sent. The SCC Admin must approve it.');render();return}
    hwMove(dv,ns,nl,r,S.user);closeDialog();toast(`${dv.type} ${dv.serial} is now ${ns}${nl!==dv.loc?' at '+nl:''}.`);render()}}
function hwAddDialog(){const d=openDialog(`<h3>Add device</h3><div class="fgrid"><div class="fld"><label for="aT">Device</label><select id="aT">${HW_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fld"><label for="aS">Serial number</label><input id="aS"></div><div class="fld"><label for="aSt">Status</label><select id="aSt"></select></div><div class="fld"><label for="aL">Project</label><select id="aL">${HW_LOCS.map(l=>`<option>${l}</option>`).join('')}</select></div></div><div class="row" style="justify-content:flex-end"><button class="btn" id="aX">Cancel</button><button class="btn pri" id="aGo">Add device</button></div>`);
  const f=()=>{$('#aSt').innerHTML=stList($('#aT').value).map(s=>`<option ${s==='In Stock'?'selected':''}>${s}</option>`).join('')};$('#aT').onchange=f;f();$('#aX').onclick=closeDialog;
  $('#aGo').onclick=()=>{const s=$('#aS').value.trim();if(!s)return toast('Enter the serial number.');if(HW_REG.some(x=>x.serial.toLowerCase()===s.toLowerCase()))return toast('Serial number '+s+' is already registered.');const dev={type:$('#aT').value,serial:s,st:'Not registered',loc:$('#aL').value,upd:Date.now(),seen:null};HW_REG.unshift(dev);hwMove(dev,$('#aSt').value,dev.loc,'Device added to register',S.user);closeDialog();toast(dev.type+' '+s+' added.');render()}}
/* ---------- import / export / template ---------- */
function xlsxOut(name,sheet,rows){try{if(window.XLSX){const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,sheet.slice(0,31));XLSX.writeFile(wb,name);toast('Excel export started: '+name)}else downloadCSV(name.replace(/\.xlsx$/,'.csv'),rows)}catch(e){toast('Export is available on the hosted platform')}}
function hwTemplate(){xlsxOut('SCC_HW_Device_Register_Template.xlsx','Device Register',[['Device','Serial Number','Status','Project'],['AI Camera','AIC-4M-00999','Installed','Jafurah'],['Smart Watch','53639999','Assigned','Yanbu'],['GPS','GPS-867399999','In Stock','Dhahran'],[],['Device: '+HW_TYPES.join(', ')],['Status: Installed, Assigned, In Stock, Under Maintenance, Damaged, Lost'],['Project: '+HW_LOCS.join(', ')]])}
const HW_DEV_ALIAS={};HW_TYPES.forEach(t=>HW_DEV_ALIAS[t.toLowerCase()]=t);Object.assign(HW_DEV_ALIAS,{'smartwatch':'Smart Watch','cctv':'AI Camera','dash cam':'Dashcam','helmet':'Smart Helmet','weather':'Weather Station','edge':'Edge Server','pwas set':'PWAS'});
const HW_ST_ALIAS={installed:'__U',assigned:'__U',online:'__U',active:'__U','in use':'__U','in stock':'In Stock',stock:'In Stock','under maintenance':'Under Maintenance',maintenance:'Under Maintenance',damaged:'Damaged',faulty:'Damaged',lost:'Lost',missing:'Lost'};
async function hwImport(e){const f=e.target.files[0];if(!f)return;
  try{let rows;if(/\.csv$/i.test(f.name)){rows=(await f.text()).split(/\r?\n/).map(l=>l.split(',').map(c=>c.replace(/^"|"$/g,'').trim()))}else if(window.XLSX){const wb=XLSX.read(await f.arrayBuffer());const sh=wb.Sheets[wb.SheetNames.find(n=>/device register/i.test(n))||wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''}).map(r=>r.map(c=>String(c).trim()))}else throw new Error('Excel reader not available. Save the sheet as CSV and import again.');
    const hi=rows.findIndex(r=>r.some(c=>/^device$/i.test(c))&&r.some(c=>/serial/i.test(c)));if(hi<0)throw new Error('The sheet needs the headers Device, Serial Number, Status and Project.');
    const Hh=rows[hi].map(c=>c.toLowerCase()),ix=k=>Hh.findIndex(h=>h.includes(k)),cD=ix('device'),cS=ix('serial'),cT=ix('status'),cP=ix('project');const seen={};
    const out=rows.slice(hi+1).filter(r=>(r[cD]||'')+(r[cS]||'')).map((r,k)=>{const errs=[],type=HW_DEV_ALIAS[(r[cD]||'').toLowerCase()],serial=r[cS]||'',loc=HW_LOCS.find(l=>l.toLowerCase()===(r[cP]||'').toLowerCase());let st=HW_ST_ALIAS[(r[cT]||'').toLowerCase()];if(st==='__U')st=type?inUse(type):'Installed';
      if(!type)errs.push(r[cD]?'Unknown device "'+r[cD]+'"':'Device missing');if(!serial)errs.push('Serial number missing');else if(HW_REG.some(d=>d.serial.toLowerCase()===serial.toLowerCase()))errs.push('Already in the register');else if(seen[serial.toLowerCase()])errs.push('Repeated in the file');seen[serial.toLowerCase()]=1;
      if(!st)errs.push(r[cT]?'Unknown status "'+r[cT]+'"':'Status missing');if(!loc)errs.push(r[cP]?'Unknown project "'+r[cP]+'"':'Project missing');return{row:hi+k+2,type,serial,st,loc,raw:r,errs}});
    const ok=out.filter(r=>!r.errs.length);
    const d=openDialog(`<h3>Import device register</h3><p class="muted" style="margin:0">${esc(f.name)} · ${out.length} rows read · <b style="color:var(--green)">${ok.length} ready</b>${out.length-ok.length?` · <b style="color:var(--red)">${out.length-ok.length} with errors</b>`:''}</p><div class="tbl-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr><th>Row</th><th>Device</th><th>Serial</th><th>Status</th><th>Project</th><th>Result</th></tr></thead><tbody>${out.map(r=>`<tr><td class="mono">${r.row}</td><td>${esc(r.type||r.raw[cD])}</td><td class="mono">${esc(r.serial)}</td><td>${esc(r.st||r.raw[cT])}</td><td>${esc(r.loc||r.raw[cP])}</td><td>${r.errs.length?`<span style="color:var(--red)">${esc(r.errs.join('; '))}</span>`:'<span class="tagx green">Ready</span>'}</td></tr>`).join('')}</tbody></table></div><small class="muted">Rows with an error are not imported. Fix them in the sheet and import again.</small><div class="row" style="justify-content:flex-end"><button class="btn" id="iX">Cancel</button><button class="btn pri" id="iGo" ${ok.length?'':'disabled'}>Import ${ok.length} device${ok.length===1?'':'s'}</button></div>`);
    $('#iX').onclick=closeDialog;$('#iGo').onclick=()=>{ok.forEach(r=>{HW_REG.unshift({type:r.type,serial:r.serial,st:r.st,loc:r.loc,upd:Date.now(),seen:null});HWD[r.loc][r.type][hwStatusIdx(r.st)]+=1});const pj=[...new Set(ok.map(r=>r.loc))];HW_LOG.unshift({at:Date.now(),loc:pj.length===1?pj[0]:pj.length+' projects',type:ok.length+' devices',st:'As imported',from:'',to:'',why:'Imported from '+f.name,by:S.user});audit('SCC HW: register imported',f.name,ok.length+' devices');syncDeviceInventory();closeDialog();H().tab='register';toast(ok.length+' devices imported. Counts updated.');render()}
  }catch(err){toast(err.message||'The file could not be read. Use the SCC HW Device Register template.')}}

/* ---------- remove a device permanently (retired, disposed, returned to vendor) ---------- */
const HW_RM_REASONS=['Retired / disposed','Returned to vendor (warranty)','Written off after loss','Registered by mistake'];
function hwRemoveDialog(serial){if(S.role!=='Admin')return;const dv=HW_REG.find(x=>x.serial===serial);if(!dv)return;
  const d=openDialog(`<h3>Remove device</h3><p class="muted" style="margin:0">Use this only when the device has left BQ for good. For a broken, lost or repaired device, use Change status instead so it stays traceable.</p>
   <div class="kv one"><div><span>Device</span><b>${dv.type}</b></div><div><span>Serial number</span><b class="mono">${dv.serial}</b></div><div><span>Status</span><b>${dv.st}</b></div><div><span>Project</span><b>${dv.loc}</b></div></div>
   <div class="fgrid"><div class="fld"><label for="rmW">Reason <span class="req">*</span></label><select id="rmW"><option value="">Select a reason</option>${HW_RM_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="fld"><label for="rmR">Reference number <span class="req">*</span></label><input id="rmR" placeholder="Disposal note, RMA or incident no."></div></div>
   <div class="fld"><label for="rmD">Details</label><textarea id="rmD" placeholder="Optional notes"></textarea></div><label class="row" style="font-size:13px"><input type="checkbox" id="rmOk"> I confirm this device has left BQ and the evidence is available on request.</label>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="rmX">Cancel</button><button class="btn pri" id="rmGo" disabled>Remove device</button></div>`);
  const chk=()=>$('#rmGo').disabled=!($('#rmW').value&&$('#rmR').value.trim().length>=2&&$('#rmOk').checked);['#rmW','#rmR','#rmOk'].forEach(x=>{$(x).oninput=chk;$(x).onchange=chk});$('#rmX').onclick=closeDialog;
  $('#rmGo').onclick=()=>{const k=hwStatusIdx(dv.st),c=HWD[dv.loc][dv.type][k];HWD[dv.loc][dv.type][k]=Math.max(0,c-1);HW_REG.splice(HW_REG.indexOf(dv),1);
    hwLogAdd({loc:dv.loc,type:dv.type,st:dv.st,from:c,to:HWD[dv.loc][dv.type][k],why:`${dv.serial} removed: ${$('#rmW').value} · ${$('#rmR').value.trim()}${$('#rmD').value.trim()?' · '+$('#rmD').value.trim():''}`,by:S.user,act:'Device removed',serial:dv.serial});
    syncDeviceInventory();closeDialog();toast(`${dv.type} ${dv.serial} removed. Count updated and logged in Change History.`);render()}}

/* ================= shell + router ================= */
const ROUTES={
 'dashboard':{t:'Dashboard',ic:'dash',g:'Operations',v:viewDashboard,m:mountDashboard},
 'ai-camera':{t:'AI Camera Observations',ic:'cctv',g:'Operations',v:viewAI,m:mountAI,type:'ai'},
 'dashcam':{t:'Dashcam Observations',ic:'cam',g:'Operations',v:viewDashcam,m:mountDashcam,type:'dashcam'},
 'speed':{t:'Speed Violations',ic:'gauge',g:'Operations',v:viewSpeed,m:mountSpeed,type:'speed'},
 'wearables':{t:'Wearable Devices',ic:'watch',g:'Operations',v:viewWearables,m:mountWearables,type:'sos'},
 'itqan':{t:'ITQAN Violations',ic:'itqan',g:'Operations',v:viewITQAN,m:mountITQAN},
 'review':{t:'Review & Records',ic:'review',g:'Review',v:viewReview,m:mountReview},
 'reports':{t:'Reports',ic:'report',g:'Review',v:viewReports,m:mountReports},
 'kpi':{t:'KPI Dashboard',ic:'kpi',g:'Review',v:viewKPI,m:mountKPI,admin:1},
 'weather':{t:'Weather Monitoring',ic:'weather',g:'Monitoring',v:viewWeather,m:mountWeather},
 'scc-hw':{t:'SCC Hardware',ic:'server',g:'Monitoring',v:viewHW,m:mountHW},
 'contacts':{t:'Key Personnel & Contacts',ic:'phone',g:'Monitoring',v:viewContacts,m:mountContacts},
 'admin':{t:'Administration',ic:'admin',g:'Administration',v:viewAdmin,m:mountAdmin,admin:1},
 'operators':{t:'Operator Performance',ic:'perf',g:'Administration',v:viewOperators,m:mountOperators,admin:1}
};
const ROLE_USER={Operator:'Fajr',Admin:'Rayan Alghamdi','Dept HSE':'Rene Oliveria',Receiver:'Site Receiver'};
function go(r){if(!ROUTES[r])r='dashboard';if(location.hash!=='#'+r){location.hash=r}else{S.route=r;render()}}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);S.route=ROUTES[h]?h:'dashboard';closeDrawer();render();window.scrollTo(0,0)});

function shell(){
  const app=document.getElementById('app');S.user=ROLE_USER[S.role]||S.user;
  const navCount=k=>{const t=ROUTES[k].type;if(!t)return '';const open=RECORDS.filter(r=>r.type===t&&r.status!=='Closed'&&accessOk(r)).length;const od=RECORDS.filter(r=>r.type===t&&accessOk(r)&&(()=>{const s=slaState(r);return s&&(s.k==='over'||s.k==='esc')})()).length;return od?`<span class="cnt hot" title="${od} overdue">${od}</span>`:open?`<span class="cnt">${open}</span>`:''};
  const groups=[...new Set(Object.values(ROUTES).map(r=>r.g))];
  app.innerHTML=`<div class="app" id="appRoot">
  <aside class="rail" aria-label="Main navigation"><div class="rail-brand"><img src="${LOGO_W}" alt="Bin Quraya"><div class="prod"><b>SCC Platform</b></div><span class="tag"><span class="dot"></span> Safety Command Center · All systems operational</span></div>
   <nav class="nav">${groups.map(g=>`<h6>${g.toUpperCase()}</h6>`+Object.entries(ROUTES).filter(([,r])=>r.g===g).map(([k,r])=>{const locked=r.admin&&S.role!=='Admin';return `<a href="#${k}" class="${S.route===k?'on':''} ${locked?'locked':''}">${I(r.ic)}<span>${r.t}</span>${locked?I('lock','lk'):navCount(k)}</a>`}).join('')).join('')}</nav>
   <div class="rail-user"><span class="avatar">${S.user.split(' ').map(x=>x[0]).join('').slice(0,2)}</span><div><b>${esc(S.user)}</b><small>${S.role} · ${userAccess()==='All'?'All projects':userAccess().join(', ')}</small></div></div></aside>
  <div class="main"><header class="topbar"><button class="iconbtn menu-btn" id="menuBtn" aria-label="Menu">${I('menu')}</button><div class="crumb">SCC Platform / <b>${ROUTES[S.route].t}</b></div><span class="sp"></span><span class="tagx" title="Project access of the logged-in user">${I('lock')} ${userAccess()==='All'?'All projects':userAccess().join(' · ')}</span>
   <div class="search"><span>${I('search')}</span><input id="gSearch" placeholder="Search case ID, driver or asset" aria-label="Search records"></div>
   <div class="seg role" aria-label="Role">${['Operator','Admin','Dept HSE','Receiver'].map(r=>`<button data-role="${r}" class="${S.role===r?'on':''}">${r}</button>`).join('')}</div>
   <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">${I(document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches)?'sun':'moon')}</button>
   <button class="iconbtn" id="bellBtn" aria-label="Notifications">${I('bell')}<span class="badge" id="bellN" hidden></span></button></header>
   <main class="content" id="view"></main></div></div>`;
  $$('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;try{localStorage.setItem('scc-role',S.role)}catch(e){};toast('Viewing as '+S.role);render()});
  $('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('scc-theme',nx)}catch(e){};render()};
  $('#bellBtn').onclick=toggleNotif;$('#menuBtn').onclick=()=>$('#appRoot').classList.toggle('navopen');
  $$('.nav a').forEach(a=>a.addEventListener('click',()=>$('#appRoot').classList.remove('navopen')));
  const gs=$('#gSearch');gs.onkeydown=e=>{if(e.key!=='Enter')return;const q=gs.value.trim().toLowerCase();if(!q)return;const hit=RECORDS.find(r=>r.id.toLowerCase()===q)||RECORDS.find(r=>[r.id,r.driver,r.asset,r.worker,r.badge].some(v=>v&&String(v).toLowerCase().includes(q)));if(hit)openRecord(hit.id);else toast('No record matches "'+gs.value+'"')};
  updateBell();
}
function render(){
  killCharts();const npanel=$('#npanel');if(npanel)npanel.remove();
  shell();const r=ROUTES[S.route];const v=$('#view');
  v.innerHTML=r.v();
  try{r.m&&r.m()}catch(e){console.error(e)}
  $$('[data-new]',v).forEach(b=>b.onclick=()=>({ai:newAI,dashcam:newDashcam,speed:newSpeed,sos:newSOS,itqan:newITQ})[b.dataset.new]());
  bindFilters();document.title=(r.t==='Dashboard'?'SCC Platform':r.t+' · SCC Platform');
}
function updateBell(){const n=overdueList().filter(x=>x.s.k!=='soon').length;const b=$('#bellN');if(!b)return;b.hidden=!n;b.textContent=n>99?'99+':n}
function toggleNotif(){
  const ex=$('#npanel');if(ex){ex.remove();return}
  const list=overdueList();const esc_=list.filter(x=>x.s.k==='esc'),over=list.filter(x=>x.s.k==='over'),soon=list.filter(x=>x.s.k==='soon');
  const f=S.sub.nf||'all';const show=(f==='all'?list:f==='esc'?esc_:f==='over'?over:soon).slice(0,60);
  const p=document.createElement('div');p.className='npanel';p.id='npanel';
  p.innerHTML=`<div class="nh">${I('bell')}<b>Notifications</b><span class="muted" style="font-size:12px;margin-left:4px">close-out deadlines</span><button class="iconbtn" style="margin-left:auto;width:30px;height:30px" id="npX" aria-label="Close">${I('x')}</button></div>
   <div style="padding:10px 14px;border-bottom:1px solid var(--line)" class="chips">${[['all','All',list.length],['esc','Escalated',esc_.length],['over','Overdue',over.length],['soon','Due soon',soon.length]].map(([k,l,n])=>`<button class="chip ${f===k?'on':''}" data-nf="${k}">${l} <span class="n">${n}</span></button>`).join('')}</div>
   <div style="padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)">Deadlines: High ${RULES.High.label} · Medium ${RULES.Medium.label} · Low ${RULES.Low.label} · SOS 2 hours. Escalation after ${RULES.escalate}×.</div>
   ${show.map(({r,s})=>`<div class="nitem ${r.risk}" data-nopen="${r.id}"><span class="bar8"></span><div><b>${r.id} · ${TYPE_LABEL[r.type]}</b><small>${scopeOf(r)} · ${r.risk==='NA'?'SOS':r.risk+' risk'} · ${r.status}${s.k==='esc'?' · escalated to Dept HSE':''}</small></div><div class="ov ${s.k==='soon'?'soon':''}">${s.k==='soon'?fmtDur(s.left)+' left':'+'+fmtDur(s.over)}<br><small class="muted" style="font-weight:500">${s.k==='soon'?'due soon':s.k==='esc'?'escalated':'overdue'}</small></div></div>`).join('')||'<div class="empty">Nothing is overdue.</div>'}
   ${(f==='all'?list:f==='esc'?esc_:f==='over'?over:soon).length>60?`<div class="empty" style="padding:12px">Showing the 60 most overdue. Use Review & Records for the full list.</div>`:''}`;
  document.body.appendChild(p);$('#npX').onclick=()=>p.remove();
  $$('[data-nf]',p).forEach(b=>b.onclick=()=>{S.sub.nf=b.dataset.nf;p.remove();toggleNotif()});
  $$('[data-nopen]',p).forEach(b=>b.onclick=()=>{p.remove();openRecord(b.dataset.nopen)});
}
document.addEventListener('click',e=>{const p=$('#npanel');if(p&&!p.contains(e.target)&&!e.target.closest('#bellBtn')&&!e.target.closest('[data-go="notif"]')&&!e.target.closest('#sumNotif')&&!e.target.closest('[data-rvod]'))p.remove()});

(function boot(){const h=location.hash.slice(1);S.route=ROUTES[h]?h:'dashboard';render();
  setTimeout(()=>{const n=overdueList().filter(x=>x.s.k==='esc'&&x.r.risk==='High').length;if(n)toast(n+' High-risk records are escalated. Open the bell to review.')},900)})();

</script>
